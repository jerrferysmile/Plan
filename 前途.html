<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>前途 QIANTU · INTJ 行动框架</title>
  <style>
/* 前途 QIANTU — 样式表（深色、克制、信息密度优先） */

:root {
  --bg: #0b0f14;
  --surface: #121a23;
  --surface-2: #17212c;
  --surface-3: #0d141c;
  --border: #24303d;
  --border-strong: #31404f;
  --text: #e6edf3;
  --muted: #8b98a8;
  --faint: #5f6c7b;
  --accent: #5b9dff;
  --accent-strong: #7ab1ff;
  --accent-weak: rgba(91, 157, 255, 0.13);
  --green: #3fb950;
  --green-weak: rgba(63, 185, 80, 0.12);
  --yellow: #d8a028;
  --yellow-weak: rgba(216, 160, 40, 0.13);
  --red: #f0564a;
  --red-weak: rgba(240, 86, 74, 0.12);
  --radius: 12px;
  --shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", Roboto, sans-serif;
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: radial-gradient(1200px 600px at 18% -10%, rgba(91, 157, 255, 0.08), transparent 60%), var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-strong); }

h1, h2, h3, p { margin: 0; }

.num, .tabular { font-variant-numeric: tabular-nums; }

/* ------------------------------------------------------------------ 布局 */
.app { display: flex; min-height: 100vh; }

.sidebar {
  width: 228px;
  flex: 0 0 228px;
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 22px 14px 18px;
  border-right: 1px solid var(--border);
  background: linear-gradient(180deg, #0e151d 0%, #0a0f14 100%);
}

.brand { display: flex; align-items: center; gap: 11px; padding: 0 8px 20px; }
.brand-mark {
  width: 34px; height: 34px; border-radius: 10px;
  display: grid; place-items: center;
  background: linear-gradient(135deg, #2a6ad4, #5b9dff);
  color: #06101d; font-size: 16px; font-weight: 700;
}
.brand-name { font-size: 16px; font-weight: 650; letter-spacing: 0.6px; }
.brand-sub { font-size: 10.5px; color: var(--faint); letter-spacing: 1.1px; text-transform: uppercase; }

.nav { display: flex; flex-direction: column; gap: 3px; }
.nav a {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; border-radius: 9px;
  color: var(--muted); font-size: 13.5px;
  border: 1px solid transparent;
}
.nav a:hover { color: var(--text); background: rgba(255, 255, 255, 0.03); }
.nav a.active {
  color: var(--accent);
  background: var(--accent-weak);
  border-color: rgba(91, 157, 255, 0.22);
}
.nav a .nav-glyph { width: 16px; text-align: center; font-size: 12px; color: var(--faint); }
.nav a.active .nav-glyph { color: var(--accent); }

.side-foot { margin-top: auto; padding: 0 8px; display: flex; flex-direction: column; gap: 10px; }
.side-foot a { color: var(--muted); font-size: 13px; display: block; padding: 6px 4px; }
.side-foot a:hover { color: var(--text); }
.side-ver { font-size: 11px; color: var(--faint); }
.demo-tag {
  display: inline-block; padding: 2px 8px; border-radius: 999px;
  border: 1px solid rgba(216, 160, 40, 0.4); color: var(--yellow);
  background: var(--yellow-weak); font-size: 11px;
}

.main { flex: 1; min-width: 0; padding: 28px 34px 70px; }
.page { max-width: 1080px; margin: 0 auto; }

.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; margin-bottom: 22px; flex-wrap: wrap; }
.page-head h1 { font-size: 22px; font-weight: 650; letter-spacing: 0.2px; }
.page-head .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
.page-head .head-actions { display: flex; gap: 10px; align-items: center; }

/* ------------------------------------------------------------------ 卡片 */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px 20px;
}
.card-title {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; margin-bottom: 14px;
}
.card-title h2 { font-size: 14px; font-weight: 600; letter-spacing: 0.2px; }
.card-title .card-actions { display: flex; gap: 8px; align-items: center; }

.stack > * + * { margin-top: 16px; }
.section-gap { margin-top: 18px; }

.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }

.stat-value { font-size: 25px; font-weight: 650; letter-spacing: 0.3px; font-variant-numeric: tabular-nums; }
.stat-sub { font-size: 12.5px; color: var(--muted); margin-top: 5px; }
.stat-label { font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }

/* ------------------------------------------------------------------ 徽章 / 状态 */
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 2px 9px; border-radius: 999px; font-size: 12px;
  border: 1px solid transparent; white-space: nowrap; line-height: 1.7;
}
.badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.tone-green { color: var(--green); background: var(--green-weak); border-color: rgba(63, 185, 80, 0.26); }
.tone-yellow { color: var(--yellow); background: var(--yellow-weak); border-color: rgba(216, 160, 40, 0.28); }
.tone-red { color: var(--red); background: var(--red-weak); border-color: rgba(240, 86, 74, 0.3); }
.tone-accent { color: var(--accent); background: var(--accent-weak); border-color: rgba(91, 157, 255, 0.26); }
.tone-muted { color: var(--muted); background: rgba(139, 152, 168, 0.1); border-color: rgba(139, 152, 168, 0.22); }

/* ------------------------------------------------------------------ 按钮 */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 8px 14px; border-radius: 9px;
  border: 1px solid var(--border-strong); background: var(--surface-2);
  color: var(--text); font-size: 13.5px; font-family: inherit;
  cursor: pointer; text-decoration: none; white-space: nowrap;
  transition: border-color 0.15s, background 0.15s, color 0.15s;
}
.btn:hover { border-color: var(--accent); color: var(--text); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #06131f; font-weight: 600; }
.btn-primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); color: #06131f; }
.btn-ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn-ghost:hover { color: var(--text); background: rgba(255, 255, 255, 0.04); }
.btn-danger { color: var(--red); border-color: rgba(240, 86, 74, 0.4); background: transparent; }
.btn-danger:hover { background: var(--red-weak); border-color: rgba(240, 86, 74, 0.6); color: var(--red); }
.btn-sm { padding: 4px 10px; font-size: 12.5px; border-radius: 8px; }
.btn-xs { padding: 2px 8px; font-size: 12px; border-radius: 7px; }
.btn:disabled, .btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.btn:disabled:hover { border-color: var(--border-strong); }

/* ------------------------------------------------------------------ 表单 */
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 15px; }
.field > label { font-size: 12.5px; color: var(--muted); }
.field .req { color: var(--red); margin-left: 2px; }

.input {
  width: 100%;
  background: #0a1017;
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 9px;
  padding: 9px 11px;
  font-size: 13.5px;
  font-family: inherit;
  line-height: 1.4;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(91, 157, 255, 0.12); }
.input.invalid { border-color: var(--red); box-shadow: 0 0 0 3px rgba(240, 86, 74, 0.1); }
input.input[type="number"] { font-variant-numeric: tabular-nums; }
textarea.input { resize: vertical; min-height: 74px; }
select.input { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: 30px; }

.hint { font-size: 12px; color: var(--faint); }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; }
.form-grid .span-2 { grid-column: 1 / -1; }
.form-grid .span-3 { grid-column: 1 / -1; }

.calc {
  display: flex; flex-wrap: wrap; gap: 8px 22px;
  padding: 9px 13px; margin-bottom: 15px;
  background: var(--surface-3); border: 1px dashed var(--border);
  border-radius: 9px; font-size: 12.5px; color: var(--muted);
}
.calc b { color: var(--text); font-variant-numeric: tabular-nums; font-weight: 600; }
.calc .warn { color: var(--yellow); }

.radios { display: flex; gap: 8px; flex-wrap: wrap; }
.radios label {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 7px 12px; border: 1px solid var(--border); border-radius: 9px;
  cursor: pointer; font-size: 13px; color: var(--text);
  background: #0c131b; user-select: none;
}
.radios label:hover { border-color: var(--border-strong); }
.radios label:has(input:checked) { border-color: var(--accent); background: var(--accent-weak); }
.radios input { accent-color: var(--accent); margin: 0; }

.rows { display: flex; flex-direction: column; gap: 10px; }
.row-line { display: grid; grid-template-columns: 1fr 90px 1fr auto; gap: 8px; align-items: center; }
.row-line.debt { grid-template-columns: 120px 120px 110px 90px auto; }
.row-line .input { padding: 7px 9px; font-size: 13px; }
.row-line .rm {
  width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border);
  background: transparent; color: var(--muted); cursor: pointer; font-size: 15px; line-height: 1;
}
.row-line .rm:hover { color: var(--red); border-color: rgba(240, 86, 74, 0.5); }

.row-line.skill { grid-template-columns: 1fr 78px 1fr 92px auto; }

.error-list .alert-title { font-weight: 600; margin-bottom: 4px; color: var(--text); }
.error-list ul { margin: 6px 0 0; padding-left: 18px; color: var(--text); }
.error-list li { margin: 2px 0; }

.check-line { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
.check-line input { accent-color: var(--accent); }

/* ------------------------------------------------------------------ 章节 */
.section {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 20px 22px; margin-bottom: 18px;
}
.section-head { display: flex; align-items: center; gap: 11px; margin-bottom: 16px; }
.section-num {
  width: 26px; height: 26px; flex: none; border-radius: 8px;
  display: grid; place-items: center;
  background: var(--accent-weak); color: var(--accent);
  font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums;
}
.section-head h2 { font-size: 15px; font-weight: 600; }
.section-head .section-hint { color: var(--faint); font-size: 12.5px; margin-left: auto; }

.action-bar {
  position: sticky; bottom: 0; z-index: 6;
  display: flex; align-items: center; justify-content: flex-end; gap: 10px;
  padding: 14px 0 10px;
  background: linear-gradient(180deg, rgba(11, 15, 20, 0), var(--bg) 45%);
}
.action-bar .left { margin-right: auto; color: var(--faint); font-size: 12.5px; }

.error-list {
  border: 1px solid rgba(240, 86, 74, 0.35); background: var(--red-weak);
  border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; font-size: 13px;
}
.error-list ul { margin: 6px 0 0; padding-left: 18px; }

/* ------------------------------------------------------------------ 提示条 */
.alert {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 13px 16px; border-radius: 12px; border: 1px solid;
  margin-bottom: 14px; font-size: 13.5px;
}
.alert .alert-main { flex: 1; min-width: 0; }
.alert .alert-title { font-weight: 600; margin-bottom: 2px; }
.alert .alert-desc { color: var(--muted); font-size: 12.5px; }
.alert .alert-actions { display: flex; gap: 8px; flex: none; padding-top: 1px; }
.alert-red { border-color: rgba(240, 86, 74, 0.38); background: rgba(240, 86, 74, 0.07); }
.alert-yellow { border-color: rgba(216, 160, 40, 0.35); background: rgba(216, 160, 40, 0.07); }
.alert-blue { border-color: rgba(91, 157, 255, 0.32); background: rgba(91, 157, 255, 0.07); }
.alert-muted { border-color: var(--border); background: rgba(255, 255, 255, 0.02); }

/* ------------------------------------------------------------------ 列表 / 表格 */
.table-wrap { overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th {
  text-align: left; font-weight: 500; font-size: 12px; color: var(--muted);
  padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap;
}
.table td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.table tr:last-child td { border-bottom: none; }
.table tbody tr:hover { background: rgba(255, 255, 255, 0.018); }
.table .num { text-align: right; }
.table .actions { text-align: right; white-space: nowrap; }
.table .muted { color: var(--muted); }

.empty { text-align: center; padding: 44px 20px; color: var(--muted); }
.empty-title { color: var(--text); font-size: 15px; margin-bottom: 6px; }
.empty .btn { margin-top: 14px; }

.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  padding: 4px 12px; border-radius: 999px; border: 1px solid var(--border);
  background: transparent; color: var(--muted); font-size: 12.5px; font-family: inherit;
  cursor: pointer;
}
.chip:hover { color: var(--text); border-color: var(--border-strong); }
.chip.active { color: var(--accent); border-color: var(--accent); background: var(--accent-weak); }

.bar { height: 6px; border-radius: 999px; background: #0a1017; overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
.bar.green > i { background: var(--green); }
.bar.yellow > i { background: var(--yellow); }
.bar.red > i { background: var(--red); }

/* ------------------------------------------------------------------ 目标 */
.goal { padding: 18px 20px; }
.goal + .goal { border-top: 1px solid var(--border); }
.goal-head { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.goal-title { font-size: 16px; font-weight: 600; }
.goal-sub { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
.goal-head .goal-actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.goal-def { margin-top: 10px; font-size: 13px; color: var(--muted); }
.goal-def b { color: var(--text); font-weight: 500; }
.kr-list { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.kr { display: grid; grid-template-columns: minmax(0, 1fr) 150px 92px; gap: 10px; align-items: center; font-size: 13px; }
.kr .kr-text { color: var(--text); }
.kr .kr-bar { height: 5px; border-radius: 999px; background: #0a1017; overflow: hidden; }
.kr .kr-bar > i { display: block; height: 100%; background: var(--accent); }
.kr .kr-num { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12.5px; }

/* ------------------------------------------------------------------ 底线 */
.rule { padding: 18px 20px; }
.rule + .rule { border-top: 1px solid var(--border); }
.rule-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.rule-title { font-size: 15px; font-weight: 600; }
.rule-desc { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
.rule-head .rule-actions { margin-left: auto; display: flex; gap: 8px; }
.rule-threshold { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; margin-top: 12px; font-size: 12.5px; color: var(--muted); }
.rule-threshold .th-field { display: flex; align-items: center; gap: 6px; }
.rule-threshold .input { width: 74px; padding: 4px 8px; font-size: 12.5px; text-align: right; }
.rule-evidence { margin-top: 12px; display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rule-evidence .flag.red::before { content: "✕ "; color: var(--red); }
.rule-evidence .flag.yellow::before { content: "! "; color: var(--yellow); }
.rule-evidence .flag.green::before { content: "✓ "; color: var(--green); }
.decision {
  margin-top: 14px; padding: 12px 16px; border-radius: 10px;
  border-left: 3px solid var(--red); background: rgba(240, 86, 74, 0.06);
  font-size: 13px;
}
.decision.overdue { border-left-color: var(--yellow); background: rgba(216, 160, 40, 0.06); }
.decision .d-line { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
.decision .d-line b { color: var(--text); font-weight: 500; }

/* ------------------------------------------------------------------ 雷达 */
.radar-item { padding: 16px 0; border-bottom: 1px solid var(--border); }
.radar-item:last-child { border-bottom: none; }
.radar-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.radar-name { font-size: 14.5px; font-weight: 600; }
.radar-head .radar-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.radar-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 24px; margin-top: 10px; font-size: 12.5px; }
.radar-grid .k { color: var(--faint); margin-right: 6px; }
.radar-grid .v { color: var(--muted); }
.radar-signals { margin: 8px 0 0; padding-left: 18px; color: var(--muted); font-size: 12.5px; }
.radar-signals li { margin: 2px 0; }
.radar-meta { margin-top: 10px; display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--faint); align-items: center; }
.radar-meta .due { color: var(--yellow); }

/* ------------------------------------------------------------------ 弹窗 / Toast */
.overlay {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(3, 6, 10, 0.68);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 7vh 16px 16px; overflow-y: auto;
}
.modal {
  width: 100%; max-width: 580px;
  background: var(--surface); border: 1px solid var(--border-strong);
  border-radius: 16px; box-shadow: var(--shadow);
}
.modal.wide { max-width: 720px; }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 17px 22px; border-bottom: 1px solid var(--border); }
.modal-head h3 { font-size: 15px; font-weight: 600; }
.modal-close { background: none; border: none; color: var(--muted); font-size: 20px; line-height: 1; cursor: pointer; padding: 2px 6px; border-radius: 6px; }
.modal-close:hover { color: var(--text); background: rgba(255, 255, 255, 0.05); }
.modal-body { padding: 20px 22px; max-height: 66vh; overflow-y: auto; }
.modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 22px; border-top: 1px solid var(--border); }

#toast-root { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 90; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast {
  padding: 9px 16px; border-radius: 10px; font-size: 13px;
  background: #1b2632; border: 1px solid var(--border-strong);
  color: var(--text); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
  animation: toast-in 0.18s ease-out;
}
.toast.ok { border-color: rgba(63, 185, 80, 0.45); }
.toast.error { border-color: rgba(240, 86, 74, 0.5); }
@keyframes toast-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ------------------------------------------------------------------ 其他 */
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.tiny { font-size: 12px; }
.small { font-size: 12.5px; }
.mt-2 { margin-top: 8px; }
.mt-3 { margin-top: 12px; }
.mt-4 { margin-top: 16px; }
.mb-2 { margin-bottom: 8px; }
.mb-3 { margin-bottom: 12px; }
.mb-4 { margin-bottom: 16px; }
.flex { display: flex; }
.flex-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.flex-gap { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.wrap { flex-wrap: wrap; }
.divider { height: 1px; background: var(--border); margin: 16px 0; border: none; }
.kbd { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; padding: 1px 6px; border: 1px solid var(--border); border-radius: 6px; color: var(--muted); }
.nowrap { white-space: nowrap; }
.hidden { display: none !important; }

/* ------------------------------------------------------------------ 响应式 */
@media (max-width: 1000px) {
  .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 900px) {
  .app { flex-direction: column; }
  .sidebar {
    position: relative; width: 100%; height: auto; flex: none;
    border-right: none; border-bottom: 1px solid var(--border);
    padding: 12px 16px; flex-direction: row; align-items: center; gap: 14px; overflow-x: auto;
  }
  .brand { padding: 0; flex: none; }
  .brand-sub { display: none; }
  .nav { flex-direction: row; }
  .nav a { padding: 6px 10px; white-space: nowrap; }
  .nav a .nav-glyph { display: none; }
  .side-foot { margin: 0 0 0 auto; flex-direction: row; align-items: center; padding: 0; }
  .side-ver { display: none; }
  .main { padding: 20px 16px 60px; }

(function (global) {

  // ---------------------------------------------------------------- 枚举

    ],

      { value: 'exit', label: 'C 执行退出（定离职或转型时间表）' }
    ]
  };

  var RULE_META = {
    growth: {
      title: '长期无成长',
      desc: '连续若干季度技能判断为「原地踏步 / 在消耗」，且当季投入低于阈值。',
      fields: [
        { key: 'consecutiveQuarters', label: '连续季度数', suffix: '季', min: 1, max: 8 },
        { key: 'skillHoursMin', label: '季度最低投入', suffix: '小时', min: 0, max: 500 }
      ]
    },
    health: {
      title: '严重透支身体',
      desc: '连续若干季度出现周均熬夜 ≥ 阈值 或 体检新增异常 ≥ 阈值。',
      fields: [
        { key: 'consecutiveQuarters', label: '连续季度数', suffix: '季', min: 1, max: 8 },
        { key: 'lateNightsThreshold', label: '周均熬夜阈值', suffix: '天', min: 1, max: 7 },
        { key: 'examAbnormalThreshold', label: '体检异常阈值', suffix: '项', min: 1, max: 10 }
      ]
    },
    salary: {
      title: '薪资长期低于市场',
      desc: '连续若干季度有效时薪低于市场有效时薪的指定比例（市场月薪 ÷ 174h 换算）。',
      fields: [
        { key: 'consecutiveQuarters', label: '连续季度数', suffix: '季', min: 1, max: 8 },
        { key: 'marketRatio', label: '市场中位数比例', suffix: '×', min: 0.1, max: 2, step: 0.05 }
      ]
    }
  };

  // ---------------------------------------------------------------- 基础工具
  function uid(prefix) {
    return (prefix || 'id') + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
  }

  function n(value) {
    var v = typeof value === 'string' ? parseFloat(value) : value;
    return typeof v === 'number' && isFinite(v) ? v : 0;
  }

  function nullableNum(value) {
    if (value === null || value === undefined || value === '') return null;
    var v = typeof value === 'string' ? parseFloat(value) : value;
    return typeof v === 'number' && isFinite(v) ? v : null;
  }

  function round(v, digits) {
    var p = Math.pow(10, digits == null ? 2 : digits);
    return Math.round(v * p) / p;
  }

  function clamp(v, min, max) {
    return Math.min(max, Math.max(min, v));
  }

  function fmtMoney(v) {
    if (v == null || !isFinite(v)) return '—';
    return '¥' + Math.round(v).toLocaleString('zh-CN');
  }

  function fmtNum(v, digits) {
    if (v == null || !isFinite(v)) return '—';
    var r = round(v, digits == null ? 0 : digits);
    return r.toLocaleString('zh-CN', { maximumFractionDigits: digits == null ? 0 : digits });
  }

  function fmtPct(v, digits) {
    if (v == null || !isFinite(v)) return '—';
    return round(v * 100, digits == null ? 1 : digits) + '%';
  }

  function pad2(v) {
    return v < 10 ? '0' + v : '' + v;
  }

  function isoDate(d) {
    var date = d instanceof Date ? d : new Date(d);
    return date.getFullYear() + '-' + pad2(date.getMonth() + 1) + '-' + pad2(date.getDate());
  }

  function todayISO() {
    return isoDate(new Date());
  }

  function fmtDate(iso) {
    if (!iso) return '—';
    var s = String(iso).slice(0, 10);
    var parts = s.split('-');
    if (parts.length !== 3) return s;
    return parts[0] + '年' + parseInt(parts[1], 10) + '月' + parseInt(parts[2], 10) + '日';
  }

  function fmtShortDate(iso) {
    if (!iso) return '—';
    var s = String(iso).slice(0, 10);
    var parts = s.split('-');
    if (parts.length !== 3) return s;
    return parseInt(parts[1], 10) + '/' + parseInt(parts[2], 10);
  }

  function parseISO(iso) {
    if (!iso) return null;
    var s = String(iso);
    var date = new Date(s.length === 10 ? s + 'T00:00:00' : s);
    return isNaN(date.getTime()) ? null : date;
  }

  function daysBetween(fromISO, toISO) {
    var a = parseISO(fromISO);
    var b = parseISO(toISO || todayISO());
    if (!a || !b) return 0;
    var ms = b.getTime() - a.getTime();
    return Math.floor(ms / 86400000);
  }

  function startOfWeek(d) {
    var date = new Date(d.getTime());
    date.setHours(0, 0, 0, 0);
    var day = date.getDay(); // 0=Sun
    var diff = day === 0 ? 6 : day - 1;
    date.setDate(date.getDate() - diff);
    return date;
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function deepGet(obj, path) {
    var parts = path.split('.');
    var cur = obj;
    for (var i = 0; i < parts.length; i++) {
      if (cur == null) return undefined;
      cur = cur[parts[i]];
    }
    return cur;
  }

  function setByPath(obj, path, value) {
    var parts = path.split('.');
    var cur = obj;
    for (var i = 0; i < parts.length - 1; i++) {
      var key = parts[i];
      if (cur[key] == null) cur[key] = /^\d+$/.test(parts[i + 1]) ? [] : {};
      cur = cur[key];
    }
    cur[parts[parts.length - 1]] = value;
  }

  // ---------------------------------------------------------------- 季度
  function quarterOf(date, startMonth) {
    var sm = startMonth || QUARTER_START_MONTH;
    var d = date instanceof Date ? date : new Date(date);
    var m = d.getMonth() + 1;
    var fy = m >= sm ? d.getFullYear() : d.getFullYear() - 1;
    var offset = (m - sm + 12) % 12;
    var q = Math.floor(offset / 3) + 1;
    return { fy: fy, q: q };
  }

  function quarterLabel(date, startMonth) {
    var qi = quarterOf(date, startMonth);
    return qi.fy + '-Q' + qi.q;
  }

  function currentQuarter(now, startMonth) {
    var d = now || new Date();
    var qi = quarterOf(d, startMonth);
    return {
      fy: qi.fy,
      q: qi.q,
      label: qi.fy + '-Q' + qi.q,
      start: isoDate(quarterStartDate(qi.fy, qi.q, startMonth)),
      end: isoDate(quarterEndDate(qi.fy, qi.q, startMonth))
    };
  }

  function quarterStartDate(fy, q, startMonth) {
    var sm = startMonth || QUARTER_START_MONTH;
    var monthIndex = (sm - 1) + (q - 1) * 3;
    var y = fy + Math.floor(monthIndex / 12);
    var m = ((monthIndex % 12) + 12) % 12;
    return new Date(y, m, 1);
  }

  function quarterEndDate(fy, q, startMonth) {
    var start = quarterStartDate(fy, q, startMonth);
    return new Date(start.getFullYear(), start.getMonth() + 3, 0);
  }

  function parseQuarterLabel(label) {
    var m = /^(\d{4})-Q([1-4])$/.exec(String(label || ''));
    if (!m) return null;
    return { fy: parseInt(m[1], 10), q: parseInt(m[2], 10) };
  }

  function quarterIndex(label) {
    var p = parseQuarterLabel(label);
    return p ? p.fy * 4 + p.q : 0;
  }

  function recentQuarterLabels(count, now, startMonth) {
    var labels = [];
    var cur = currentQuarter(now, startMonth);
    var start = quarterStartDate(cur.fy, cur.q, startMonth);
    for (var i = 0; i < count; i++) {
      var d = new Date(start.getFullYear(), start.getMonth() - i * 3, 1);
      labels.push(quarterLabel(d, startMonth));
    }
    return labels;
  }

  function quarterRangeText(label, startMonth) {
    var p = parseQuarterLabel(label);
    if (!p) return label;
    var s = quarterStartDate(p.fy, p.q, startMonth);
    var e = quarterEndDate(p.fy, p.q, startMonth);
    return fmtShortDate(isoDate(s)) + ' – ' + fmtShortDate(isoDate(e));
  }

  // ---------------------------------------------------------------- 指标计算
  function computeIncome(income) {
    var inc = income || {};
    var main = n(inc.main), side = n(inc.side), other = n(inc.other);
    var total = main + side + other;
    var hours = n(inc.monthlyHours);
    return {
      main: main,
      side: side,
      other: other,
      total: total,
      monthlyHours: hours,
      effectiveHourly: hours > 0 ? total / hours : null,
      structure: total > 0 ? { main: main / total, side: side / total, other: other / total } : null
    };
  }

  function computeFinance(finance) {
    var f = finance || {};
    var cash = n(f.cash);
    var expense = n(f.monthlyExpense);
    var income = n(f.monthlyIncome);
    var savings = income - expense;
    return {
      cash: cash,
      monthlyExpense: expense,
      savingsRate: income > 0 ? savings / income : null,
      runwayMonths: expense > 0 ? cash / expense : null,
      debts: (f.debts || []).slice()
    };
  }

  function suggestIncomeJudgement(income, settings) {
    var inc = income || {};
    var main = n(inc.main);
    var market = n(inc.marketMonthlyMedian) || n((settings || {}).marketMedianSalary);
    if (!market || main <= 0) return null;
    var ratio = main / market;
    if (ratio >= 1) return 'healthy';
    if (ratio >= 0.8) return 'optimize';
    return 'change';
  }

  function suggestSkillJudgement(skills) {
    var s = skills || {};
    var hours = n(s.hours);
    if (hours >= 20) return 'accumulating';
    if (hours > 0) return 'stagnant';
    return 'consuming';
  }

  function suggestFinanceJudgement(finance) {
    var fin = computeFinance(finance);
    if (fin.runwayMonths == null) return null;
    if (fin.runwayMonths >= 12) return 'safe';
    if (fin.runwayMonths >= 6) return 'warning';
    return 'danger';
  }

  function suggestRiskJudgement(risk) {
    var r = risk || {};
    if (r.socialSecurity === 'none' || r.socialSecurity === 'broken') return 'handle';
    var h = r.health || {};
    if (n(h.lateNightsPerWeek) >= 4 || n(h.abnormalExamItems) >= 2) return 'handle';
    if (r.careerRisk === 'shrink' || r.careerRisk === 'replaceable') return 'handle';
    return 'controllable';
  }

  function countEvidence(items) {
    return (items || []).filter(function (it) {
      return it && it.keep !== false && String(it.evidence || '').trim() !== '';
    }).length;
  }

  /** 复盘表单里可实时计算的指标 */
  function reviewMetrics(review, settings) {
    var r = review || {};
    var income = computeIncome(r.income);
    var finance = computeFinance(Object.assign({}, r.finance, { monthlyIncome: income.total }));
    var skillItems = (r.skills && r.skills.items) || [];
    return {
      income: income,
      finance: finance,
      effectiveHourly: income.effectiveHourly,
      savingRate: income.total > 0 && finance.monthlyExpense > 0 ? (income.total - finance.monthlyExpense) / income.total : null,
      runwayMonths: finance.runwayMonths,
      debtBalance: (finance.debts || []).reduce(function (sum, d) { return sum + n(d.balance); }, 0),
      skillHours: n((r.skills || {}).hours),
      evidenceCount: countEvidence(skillItems),
      suggestions: {
        income: suggestIncomeJudgement(r.income, settings),
        skills: suggestSkillJudgement(r.skills),
        finance: suggestFinanceJudgement(Object.assign({}, r.finance, { monthlyIncome: income.total })),
        risk: suggestRiskJudgement(r.risk)
      }
    };
  }

  // ---------------------------------------------------------------- 校验
  function validateReview(review) {
    var r = review || {};
    var errors = [];
    var inc = r.income || {};
    var fin = r.finance || {};
    var risk = r.risk || {};
    var skill = r.skills || {};

    function reqNum(path, val, label, min) {
      if (nullableNum(val) == null) {
        errors.push({ path: path, msg: label + ' 未填写' });
      } else if (n(val) < (min == null ? 0 : min)) {
        errors.push({ path: path, msg: label + ' 不能小于 ' + (min == null ? 0 : min) });
      }
    }

    reqNum('income.main', inc.main, '主业月均收入', 0);
    reqNum('income.side', inc.side, '副业月均收入', 0);
    reqNum('income.other', inc.other, '其他月均收入', 0);
    reqNum('income.monthlyHours', inc.monthlyHours, '月均总工时', 1);
    if (n(inc.main) + n(inc.side) + n(inc.other) <= 0) {
      errors.push({ path: 'income.main', msg: '总收入不能为 0' });
    }
    if (nullableNum(inc.marketMonthlyMedian) == null) {
      errors.push({ path: 'income.marketMonthlyMedian', msg: '市场月薪中位数未填写（薪资底线规则需要它）' });
    }
    if (!inc.salaryEvent) errors.push({ path: 'income.salaryEvent', msg: '未选择涨薪/跳槽节点' });
    if (!inc.judgement) errors.push({ path: 'income.judgement', msg: '主业收益判断未选择' });

    reqNum('skills.hours', skill.hours, '技能投入时长', 0);
    if (!skill.transferability) errors.push({ path: 'skills.transferability', msg: '可迁移性未选择' });
    if (!skill.judgement) errors.push({ path: 'skills.judgement', msg: '技能积累判断未选择' });

    reqNum('finance.cash', fin.cash, '现金存款', 0);
    reqNum('finance.monthlyExpense', fin.monthlyExpense, '月均总支出', 1);
    if (!fin.judgement) errors.push({ path: 'finance.judgement', msg: '存款判断未选择' });

    if (!risk.socialSecurity) errors.push({ path: 'risk.socialSecurity', msg: '社保/公积金状态未选择' });
    if (!risk.socialSecurityCheckedAt) errors.push({ path: 'risk.socialSecurityCheckedAt', msg: '社保核对日期未填写' });
    reqNum('risk.health.abnormalExamItems', (risk.health || {}).abnormalExamItems, '体检新增异常项数', 0);
    reqNum('risk.health.workoutPerWeek', (risk.health || {}).workoutPerWeek, '周均运动次数', 0);
    reqNum('risk.health.lateNightsPerWeek', (risk.health || {}).lateNightsPerWeek, '周均熬夜天数', 0);
    if (!risk.careerRisk) errors.push({ path: 'risk.careerRisk', msg: '职业风险未选择' });
    if (!risk.judgement) errors.push({ path: 'risk.judgement', msg: '风险判断未选择' });

    if (!r.conclusion) errors.push({ path: 'conclusion', msg: '本季结论未选择' });
    if (!r.oneLineSummary || String(r.oneLineSummary).trim().length < 4) {
      errors.push({ path: 'oneLineSummary', msg: '本季一句话总结至少 4 个字' });
    }
    if (!r.topOne || String(r.topOne).trim().length < 4) {
      errors.push({ path: 'topOne', msg: '下季唯一最重要的事未填写（至少 4 个字）' });
    }
    return errors;
  }

  function validateGoal(goal) {
    var errors = [];
    if (!goal.title || String(goal.title).trim().length < 2) errors.push({ path: 'title', msg: '目标名至少 2 个字' });
    if (!goal.definitionOfDone || String(goal.definitionOfDone).trim().length < 4) {
      errors.push({ path: 'definitionOfDone', msg: '完成标准必须可验证（至少 4 个字）' });
    }
    if (!goal.deadline) errors.push({ path: 'deadline', msg: '截止时间未填写' });
    var krs = (goal.keyResults || []).filter(function (k) { return String(k.text || '').trim(); });
    if (krs.length === 0) errors.push({ path: 'keyResults', msg: '至少填写 1 条关键结果' });
    if (krs.length > 3) errors.push({ path: 'keyResults', msg: '关键结果最多 3 条' });
    for (var i = 0; i < krs.length; i++) {
      if (nullableNum(krs[i].target) == null || n(krs[i].target) <= 0) {
        errors.push({ path: 'keyResults', msg: '第 ' + (i + 1) + ' 条关键结果需要填写数字目标' });
      }
    }
    return errors;
  }

  function validateWatchItem(item) {
    var errors = [];
    if (!item.name || String(item.name).trim().length < 2) errors.push({ path: 'name', msg: '赛道名至少 2 个字' });
    var signals = (item.signals || []).filter(function (s) { return String(s || '').trim(); });
    if (signals.length < 2) errors.push({ path: 'signals', msg: '至少填写 2 条信号（这是判断增量的依据）' });
    if (n(item.crowdedness) < 1 || n(item.crowdedness) > 5) errors.push({ path: 'crowdedness', msg: '拥挤度需在 1–5 之间' });
    return errors;
  }

  // ---------------------------------------------------------------- 底线规则
  function completedReviewsChron(data) {
    return ((data && data.reviews) || [])
      .filter(function (r) { return r.status === 'done'; })
      .sort(function (a, b) { return quarterIndex(a.quarter) - quarterIndex(b.quarter); });
  }

  function ruleQuarterFlag(type, review, threshold, settings) {
    var label = review.quarter;
    var th = threshold || {};
    var m = reviewMetrics(review, settings);
    if (type === 'growth') {
      var judgement = (review.skills || {}).judgement;
      var hours = m.skillHours;
      var bad = (judgement === 'stagnant' || judgement === 'consuming') && hours < n(th.skillHoursMin);
      return {
        label: label,
        bad: bad,
        detail: label + ' · 投入 ' + fmtNum(hours, 0) + 'h · ' + enumLabel(ENUMS.skillJudgement, judgement)
      };
    }
    if (type === 'health') {
      var h = (review.risk || {}).health || {};
      var late = n(h.lateNightsPerWeek);
      var exam = n(h.abnormalExamItems);
      var badHealth = late >= n(th.lateNightsThreshold) || exam >= n(th.examAbnormalThreshold);
      return {
        label: label,
        bad: badHealth,
        detail: label + ' · 熬夜 ' + fmtNum(late, 0) + ' 天/周 · 体检异常 ' + fmtNum(exam, 0) + ' 项'
      };
    }
    if (type === 'salary') {
      var market = n((review.income || {}).marketMonthlyMedian) || n((settings || {}).marketMedianSalary);
      if (!market) {
        return { label: label, bad: null, detail: label + ' · 缺少市场数据' };
      }
      var marketHourly = market / STANDARD_MONTH_HOURS;
      var hourly = m.effectiveHourly;
      if (hourly == null) return { label: label, bad: null, detail: label + ' · 缺少工时数据' };
      var ratio = hourly / marketHourly;
      var badSalary = ratio < n(th.marketRatio);
      return {
        label: label,
        bad: badSalary,
        detail: label + ' · 有效时薪 ' + fmtMoney(hourly) + ' / 市场 ' + fmtMoney(marketHourly) + '（' + fmtPct(ratio) + '）'
      };
    }
    return { label: label, bad: null, detail: label };
  }

  function evaluateRule(rule, reviews, settings) {
    var type = rule.type;
    var need = clamp(Math.round(n((rule.threshold || {}).consecutiveQuarters) || 2), 1, 8);
    var flags = reviews.map(function (r) { return ruleQuarterFlag(type, r, rule.threshold, settings); });
    var status = 'green';
    if (flags.length === 0) {
      status = 'unknown';
    } else {
      var known = flags.filter(function (f) { return f.bad !== null; });
      if (known.length === 0) {
        status = 'unknown';
      } else {
        var count = 0;
        for (var i = flags.length - 1; i >= 0; i--) {
          if (flags[i].bad === null) continue;
          if (flags[i].bad) count++;
          else break;
        }
        status = count >= need ? 'red' : count > 0 ? 'yellow' : 'green';
      }
    }
    return {
      type: type,
      ruleId: rule.id,
      need: need,
      status: status,
      flags: flags.slice(-6),
      badCount: flags.filter(function (f) { return f.bad === true; }).length
    };
  }

  function currentDecision(rule) {
    var list = rule.decisions || [];
    for (var i = list.length - 1; i >= 0; i--) {
      if (!list[i].reviewedAt) return list[i];
    }
    return null;
  }

  function runRules(data, now) {
    var reviews = completedReviewsChron(data);
    var rules = (data.bottomLines || []).map(function (rule) {
      var res = evaluateRule(rule, reviews, data.settings || {});
      var decision = currentDecision(rule);
      var overdue = decision && decision.deadline ? daysBetween(decision.deadline, isoDate(now || new Date())) > 0 : false;
      return Object.assign({
        title: RULE_META[rule.type] ? RULE_META[rule.type].title : rule.type,
        enabled: rule.enabled !== false,
        decision: decision,
        decisionOverdue: !!overdue
      }, res);
    });
    return rules;
  }

  // ---------------------------------------------------------------- 目标
  function activeGoals(goals, year) {
    return (goals || []).filter(function (g) {
      return (g.year === year || year == null) && (g.status === 'active' || g.status === 'maintained');
    });

  function goalNextAction(goal) {
    var krs = (goal.keyResults || []).filter(function (k) { return String(k.text || '').trim(); });
    var pending = krs.find(function (k) { return n(k.current) < n(k.target); });
    return pending ? pending.text : '关键结果已全部完成，可结项';
  }

  function goalProgress(goal) {
    var krs = (goal.keyResults || []).filter(function (k) { return String(k.text || '').trim() && n(k.target) > 0; });
    if (krs.length === 0) return null;
    var sum = krs.reduce(function (acc, k) { return acc + clamp(n(k.current) / n(k.target), 0, 1); }, 0);
    return sum / krs.length;
  }

  // ---------------------------------------------------------------- 赛道雷达
  function observationDays(item, now) {
    if (!item || !item.observationStartedAt) return 0;
    return Math.max(0, Math.floor((new Date(now || new Date()).getTime() - parseISO(item.observationStartedAt).getTime()) / 86400000));
  }

  function canWatchTransition(item, target, now) {
    if (!item) return { ok: false, daysLeft: 30 };
    if (item.status !== 'observing') return { ok: true, daysLeft: 0 };
    if (target === item.status) return { ok: true, daysLeft: 0 };
    if (target === 'dropped') return { ok: true, daysLeft: 0 }; // 主动放弃不受观察期限制
    var days = observationDays(item, now);
    if (days >= 30) return { ok: true, daysLeft: 0 };
    return { ok: false, daysLeft: 30 - days };
  }

  function weekInputMinutes(data, now) {
    var weekStart = startOfWeek(now || new Date());
    var startISO = isoDate(weekStart);
    return ((data && data.inputLog) || []).reduce(function (sum, entry) {
      var d = parseISO(entry.date);
      if (d && isoDate(d) >= startISO) return sum + n(entry.minutes);
      return sum;
    }, 0);
  }

  function normalizeData(raw) {
    if (!raw || typeof raw !== 'object') return null;
    var data = defaultData(new Date());
    // 保留未知字段，只补齐缺失的默认项
    var merged = Object.assign({}, data, raw);
    merged.settings = Object.assign({}, data.settings, raw.settings || {});
    merged.goals = Array.isArray(raw.goals) ? raw.goals : [];
    merged.reviews = Array.isArray(raw.reviews) ? raw.reviews.map(normalizeReview) : [];
    merged.watchItems = Array.isArray(raw.watchItems) ? raw.watchItems : [];
    merged.inputLog = Array.isArray(raw.inputLog) ? raw.inputLog : [];
    merged.bottomLines = Array.isArray(raw.bottomLines) && raw.bottomLines.length
      ? raw.bottomLines
      : data.bottomLines;
    return merged;
  }

    var review = Object.assign({

    review.skills = Object.assign({ items: [] }, review.skills || {});
    review.finance = Object.assign({ debts: [] }, review.finance || {});
    review.finance.debts = Array.isArray(review.finance.debts) ? review.finance.debts : [];
    review.risk = Object.assign({ health: {} }, review.risk || {});
    review.risk.health = Object.assign({}, review.risk.health || {});
    review.income = Object.assign({}, review.income || {});
    return review;
  }

  function loadData() {
    try {
      if (!global.localStorage) return null;
      var keys = [STORE_KEY].concat(LEGACY_STORE_KEYS);
      for (var i = 0; i < keys.length; i++) {
        var raw = global.localStorage.getItem(keys[i]);
        if (raw) {
          var parsed = JSON.parse(raw);
          return normalizeData(parsed);
        }
      }
      return null;
    } catch (e) {
      if (global.console) global.console.warn('[qiantu] 读取本地数据失败', e);
      return null;
    }
  }

  function saveData(data) {
    data.updatedAt = new Date().toISOString();
    try {
      if (global.localStorage) {
        global.localStorage.setItem(STORE_KEY, JSON.stringify(data));
        // 旧键数据已迁移到新键，清掉避免两份数据分叉
        LEGACY_STORE_KEYS.forEach(function (key) {
          try { global.localStorage.removeItem(key); } catch (e) { /* ignore */ }
        });
      }
      return true;
    } catch (e) {
      if (global.console) global.console.warn('[qiantu] 保存失败', e);
      return false;
    }
  }

  function removeData() {
    try {
      if (!global.localStorage) return;
      global.localStorage.removeItem(STORE_KEY);
      LEGACY_STORE_KEYS.forEach(function (key) {
        try { global.localStorage.removeItem(key); } catch (e) { /* ignore */ }
      });
    } catch (e) { /* ignore */ }
  }

    var copy = JSON.parse(JSON.stringify(data));

  function importJSON(text) {
    var parsed = JSON.parse(text);
    if (!parsed || typeof parsed !== 'object') throw new Error('不是有效的 JSON 对象');
    if (!Array.isArray(parsed.reviews) || !Array.isArray(parsed.bottomLines)) {
      throw new Error('缺少 reviews / bottomLines，可能不是「前途」的备份文件');

    return normalizeData(parsed);

</script>
  <script>
/* 前途 QIANTU — 界面与交互
 * 依赖 core.js（window.Core）。所有数据只保存在本机浏览器。
 */
(function () {
  'use strict';

  var C = window.Core;
  var esc = C.escapeHtml;

  var state = {
    data: null,
    demo: false,
    route: 'home',
    editingReviewId: null,
    showCompare: false,
    radarFilter: 'all',
    saveTimer: null,
    savedAt: null
  };

  // ================================================================ 小工具
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  function nowISO() { return new Date().toISOString(); }

  function goto(hash) {
    if (location.hash === hash) render();
    else location.hash = hash;
  }

  function persist() {
    if (state.demo) return;
    C.saveData(state.data);
  }

  function scheduleSave() {
    if (state.demo) return;
    clearTimeout(state.saveTimer);
    state.saveTimer = setTimeout(function () {
      C.saveData(state.data);
      state.savedAt = new Date();
      var el = $('#autosave-note');
      if (el) el.textContent = '已自动保存 ' + state.savedAt.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    }, 600);
  }

  function toast(msg, kind) {
    var root = $('#toast-root');
    var el = document.createElement('div');
    el.className = 'toast ' + (kind || 'ok');
    el.textContent = msg;
    root.appendChild(el);
    setTimeout(function () { el.remove(); }, 2800);
  }

  // ---------------------------------------------------------------- 弹窗
  function openModal(opts) {
    var root = $('#modal-root');
    var overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML =
      '<div class="modal' + (opts.wide ? ' wide' : '') + '">' +
        '<div class="modal-head"><h3>' + esc(opts.title || '') + '</h3>' +
          '<button type="button" class="modal-close" data-modal-close aria-label="关闭">×</button></div>' +
        '<div class="modal-body">' + (opts.body || '') + '</div>' +
        (opts.footer ? '<div class="modal-foot">' + opts.footer + '</div>' : '') +
      '</div>';
    root.appendChild(overlay);
    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) closeModal(overlay);
    });
    var closeBtn = overlay.querySelector('[data-modal-close]');
    if (closeBtn) closeBtn.addEventListener('click', function () { closeModal(overlay); });
    if (opts.onMount) opts.onMount(overlay);
    return overlay;
  }

  function closeModal(overlay) {
    if (overlay && overlay.parentNode) overlay.remove();
  }

  function modalRoot() { return $('#modal-root'); }

  function confirmAction(opts) {
    var ov = openModal({
      title: opts.title || '确认',
      body: '<p class="muted" style="line-height:1.7">' + (opts.message || '') + '</p>' +
        (opts.inputLabel
          ? '<div class="field mt-3"><label>' + esc(opts.inputLabel) + '</label><input class="input" id="confirm-input" placeholder="' + esc(opts.inputPlaceholder || '') + '"></div>'
          : ''),
      footer: '<button type="button" class="btn" data-close>取消</button>' +
        '<button type="button" class="btn ' + (opts.danger ? 'btn-danger' : 'btn-primary') + '" id="confirm-ok">' + esc(opts.okLabel || '确认') + '</button>',
      onMount: function (o) {
        o.querySelector('[data-close]').addEventListener('click', function () { closeModal(o); });
        o.querySelector('#confirm-ok').addEventListener('click', function () {
          var val = o.querySelector('#confirm-input') ? o.querySelector('#confirm-input').value.trim() : '';
          if (opts.inputLabel && !val) { toast(opts.inputRequired || '请填写内容', 'error'); return; }
          closeModal(o);
          if (opts.onOk) opts.onOk(val);
        });
      }
    });
    return ov;
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      var overlays = $$('#modal-root .overlay');
      if (overlays.length) closeModal(overlays[overlays.length - 1]);
    }
  });

  // ---------------------------------------------------------------- 通用渲染件
  function pageHead(title, sub, actions) {
    return '<div class="page-head">' +
      '<div><h1>' + esc(title) + '</h1>' + (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>' +
      (actions ? '<div class="head-actions">' + actions + '</div>' : '') +
    '</div>';
  }

  function statusTone(status) {
    if (status === 'green' || status === 'done' || status === 'safe' || status === 'accumulating' || status === 'healthy' || status === 'controllable' || status === 'achieved' || status === 'raised' || status === 'entered' || status === 'maintained') return 'tone-green';
    if (status === 'yellow' || status === 'warning' || status === 'stagnant' || status === 'optimize' || status === 'handle' || status === 'adjust') return 'tone-yellow';
    if (status === 'red' || status === 'danger' || status === 'consuming' || status === 'change' || status === 'triggered' || status === 'exit' || status === 'shrink' || status === 'replaceable') return 'tone-red';
    if (status === 'draft' || status === 'observing' || status === 'unknown') return 'tone-muted';
    if (status === 'continue' || status === 'active' || status === 'researching') return 'tone-accent';
    return 'tone-muted';
  }

  function ruleBadge(status) {
    var map = { green: '正常', yellow: '接近阈值', red: '已触发', unknown: '未评估' };
    return '<span class="badge ' + statusTone(status) + '"><span class="dot"></span>' + (map[status] || status) + '</span>';
  }

  function badge(text, tone) {
    return '<span class="badge ' + (tone || 'tone-muted') + '"><span class="dot"></span>' + esc(text) + '</span>';
  }

  function enumBadge(list, value) {
    var label = C.enumLabel(list, value);
    return badge(label, statusTone(value));
  }

  function ksItem(label, value) {
    return '<span><span class="faint">' + label + '</span> <b>' + value + '</b></span>';
  }

  // ---------------------------------------------------------------- 输入控件
  function fieldWrap(label, control, opts) {
    opts = opts || {};
    return '<div class="field' + (opts.span ? ' span-2' : '') + '" data-field="' + esc(opts.path || '') + '">' +
      '<label>' + label + (opts.req ? '<span class="req">*</span>' : '') + '</label>' +
      control +
      (opts.hint ? '<div class="hint">' + opts.hint + '</div>' : '') +
      '</div>';
  }

  function numControl(path, value, opts) {
    opts = opts || {};
    return '<input class="input" type="number" inputmode="decimal" data-path="' + esc(path) + '"' +
      ' value="' + (value === null || value === undefined ? '' : esc(String(value))) + '"' +
      (opts.placeholder ? ' placeholder="' + esc(opts.placeholder) + '"' : '') +
      (opts.step ? ' step="' + opts.step + '"' : '') + ' min="0">';
  }

  function textControl(path, value, opts) {
    opts = opts || {};
    return '<input class="input" type="text" data-path="' + esc(path) + '"' +
      ' value="' + (value === null || value === undefined ? '' : esc(String(value))) + '"' +
      (opts.placeholder ? ' placeholder="' + esc(opts.placeholder) + '"' : '') + '>';
  }

  function dateControl(path, value) {
    return '<input class="input" type="date" data-path="' + esc(path) + '" value="' + esc(value || '') + '">';
  }

  function textareaControl(path, value, opts) {
    opts = opts || {};
    return '<textarea class="input" data-path="' + esc(path) + '" rows="' + (opts.rows || 3) + '"' +
      (opts.placeholder ? ' placeholder="' + esc(opts.placeholder) + '"' : '') + '>' + esc(value || '') + '</textarea>';
  }

  function selectControl(path, value, options, opts) {
    opts = opts || {};
    return '<select class="input" data-path="' + esc(path) + '">' +
      options.map(function (opt) {
        return '<option value="' + esc(opt.value) + '"' + (opt.value === value ? ' selected' : '') + '>' + esc(opt.label) + '</option>';
      }).join('') +
      '</select>';
  }

  function radiosControl(path, value, options) {
    var group = 'rg_' + path.replace(/[^a-z0-9]/gi, '_') + '_' + Math.random().toString(36).slice(2, 6);
    return '<div class="radios">' + options.map(function (opt) {
      return '<label><input type="radio" name="' + group + '" data-path="' + esc(path) + '" value="' + esc(opt.value) + '"' +
        (opt.value === value ? ' checked' : '') + '>' + esc(opt.label) + '</label>';
    }).join('') + '</div>';
  }

  /** 从容器读取所有 data-path 字段到目标对象（用于弹窗表单） */
  function readFields(root, target) {
    $$('[data-path]', root).forEach(function (el) {
      var path = el.dataset.path;
      var type = (el.type || '').toLowerCase();
      if (type === 'radio') {
        if (el.checked) C.setByPath(target, path, el.value);
      } else if (type === 'checkbox') {
        C.setByPath(target, path, el.checked);
      } else if (type === 'number') {
        C.setByPath(target, path, C.nullableNum(el.value));
      } else {
        C.setByPath(target, path, el.value.trim());
      }
    });
  }

  function showErrors(container, errors) {
    var box = container.querySelector('.error-list');
    if (!box) return;
    if (!errors.length) { box.innerHTML = ''; box.classList.add('hidden'); return; }
    box.classList.remove('hidden');
    box.innerHTML = '<div class="alert-title">还有 ' + errors.length + ' 处未完成</div><ul>' +
      errors.map(function (e) { return '<li>' + esc(e.msg) + '</li>'; }).join('') + '</ul>';
  }

  function markInvalid(root, errors) {
    $$('.input.invalid', root).forEach(function (el) { el.classList.remove('invalid'); });
    errors.forEach(function (e) {
      var el = root.querySelector('[data-path="' + e.path + '"]');
      if (el) el.classList.add('invalid');
    });
    var first = root.querySelector('.input.invalid');
    if (first) first.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }

  // ================================================================ 路由
  function parseHash() {
    var h = (location.hash || '').replace(/^#\/?/, '');
    var parts = h.split('/');
    return { route: parts[0] || 'home', arg: parts[1] || null };
  }

  function setNavActive(route) {
    var key = route === 'review' ? 'reviews' : route;
    $$('#nav a').forEach(function (a) {
      a.classList.toggle('active', a.dataset.route === key);
    });
    var settings = $('#nav a[data-route="settings"]');
    if (settings) settings.classList.toggle('active', route === 'settings');
  }

  function render() {
    var parsed = parseHash();
    var view = $('#view');
    if (!view) return;
    state.route = parsed.route;
    if (state.saveTimer) {
      clearTimeout(state.saveTimer);
      state.saveTimer = null;
      if (!state.demo) C.saveData(state.data);
    }
    setNavActive(parsed.route);
    switch (parsed.route) {
      case 'home': renderHome(view); break;
      case 'reviews': renderReviews(view); break;
      case 'review': renderReviewEdit(view, parsed.arg); break;
      case 'goals': renderGoals(view); break;
      case 'bottom': renderBottom(view); break;
      case 'radar': renderRadar(view); break;
      case 'settings': renderSettings(view); break;
      default:
        view.innerHTML = pageHead('页面不存在', '', '<a class="btn" href="#/home">回到总览</a>');
    }
    window.scrollTo(0, 0);
  }

  window.addEventListener('hashchange', render);

  // ================================================================ 总览（首页）
  function getRules() { return C.runRules(state.data); }

  function renderHome(view) {
    var data = state.data;
    var now = new Date();
    var q = C.currentQuarter(now, data.settings.quarterStartMonth);
    var rules = getRules();
    var done = C.completedReviewsChron(data);
    var latest = done[done.length - 1] || null;
    var currentDone = data.reviews.filter(function (r) { return r.quarter === q.label && r.status === 'done'; })[0] || null;
    var currentDraft = data.reviews.filter(function (r) { return r.quarter === q.label && r.status === 'draft'; })[0] || null;
    var active = C.activeGoals(data.goals, q.fy);
    var weekMin = C.weekInputMinutes(data, now);
    var weekGoal = C.n(data.settings.weeklyInputGoalMinutes);
    var backupDays = C.backupDays(data, now);
    var activeRules = rules.filter(function (r) { return r.enabled; });
    var redCount = activeRules.filter(function (r) { return r.status === 'red'; }).length;
    var yellowCount = activeRules.filter(function (r) { return r.status === 'yellow'; }).length;
    var greenCount = activeRules.filter(function (r) { return r.status === 'green'; }).length;
    var radarItems = data.watchItems || [];
    var radarDue = radarItems.filter(function (w) { return w.nextReviewAt && w.nextReviewAt <= C.todayISO() && (w.status === 'observing' || w.status === 'researching'); });

    var html = '';
    var headAction = currentDone
      ? '<a class="btn" href="#/review/' + currentDone.id + '">查看本季复盘</a>'
      : (currentDraft
        ? '<a class="btn btn-primary" href="#/review/' + currentDraft.id + '">继续填写本季复盘</a>'
        : '<button class="btn btn-primary" data-action="new-review">开始本季复盘</button>');
    html += pageHead('总览', esc(q.fy + ' 年 · 第 ' + q.q + ' 季度') + ' · ' + esc(q.start) + ' – ' + esc(q.end), headAction);

    // ---- 提示区
    var alerts = [];
    if (!currentDone) {
      alerts.push(alertBlock('blue', currentDraft ? '本季复盘草稿未提交' : '本季复盘未完成',
        q.label + ' 还没有完成的复盘记录。这是框架唯一的硬性节奏：用 45 分钟把四本账过一遍。',
        currentDraft
          ? '<a class="btn btn-sm btn-primary" href="#/review/' + currentDraft.id + '">继续填写</a>'
          : '<button class="btn btn-sm btn-primary" data-action="new-review">开始复盘</button>'));
    }
    rules.forEach(function (rule) {
      if (!rule.enabled) return;
      if (rule.status === 'red' && !rule.decision) {
        var lastFlag = (rule.flags || []).filter(function (f) { return f.bad; }).slice(-1)[0];
        alerts.push(alertBlock('red', '已触发底线：' + rule.title,
          (lastFlag ? lastFlag.detail + '。' : '') + '按你预设的规则，现在需要做决定，而不是继续观察。',
          '<button class="btn btn-sm" data-action="open-decision" data-id="' + rule.ruleId + '">填写决策卡</button>'));
      } else if (rule.decisionOverdue) {
        alerts.push(alertBlock('yellow', '底线决策到期待复查：' + rule.title,
          '决策截止日 ' + C.fmtDate(rule.decision.deadline) + ' 已过，请复查执行情况。',
          '<a class="btn btn-sm" href="#/bottom">去底线页</a>'));
      }
    });
    var month = now.getMonth() + 1;
    if (month >= 7 && month <= 9) {
      var needMidYear = active.some(function (g) { return !g.midYearCheck; });
      if (needMidYear) {
        alerts.push(alertBlock('blue', '年中校准（7 月）', '年度目标需要一次校准：继续、降级为维持，或正式放弃。',
          '<button class="btn btn-sm" data-action="btn" data-href="#/goals">去目标页</button>'));
      }
    }
    if (done.length > 0 && (backupDays === null || backupDays > 90)) {
      alerts.push(alertBlock('muted', '数据备份提醒',
        backupDays === null ? '还没有导出过备份。数据只存在这台电脑的浏览器里。' : '上次备份是 ' + backupDays + ' 天前。',
        '<button class="btn btn-sm" data-action="export-data">导出备份</button>'));
    }
    var olderActive = data.goals.filter(function (g) {
      return (g.status === 'active' || g.status === 'maintained') && g.year < q.fy;
    });
    if (olderActive.length) {
      alerts.push(alertBlock('yellow', '上一年度还有未结项目标',
        olderActive.length + ' 个 ' + olderActive[0].year + ' 年目标仍未结项，请先结项或归档，避免目标跨年堆积。',
        '<a class="btn btn-sm" href="#/goals">去处理</a>'));
    }
    html += alerts.join('');

    // ---- 四宫格
    html += '<div class="grid grid-4">' +
      '<div class="card"><div class="stat-label">年度核心目标</div><div class="stat-value">' + active.length + ' / 2</div>' +
        '<div class="stat-sub">' + (active.length ? '下一步：' + esc(C.goalNextAction(active[0])) : '还没有立项') + '</div></div>' +
      '<div class="card"><div class="stat-label">本季唯一最重要的事</div>' +
        '<div class="stat-sub" style="font-size:14px;color:var(--text);margin-top:2px;line-height:1.5">' +
        (currentDone && currentDone.topOne ? esc(currentDone.topOne) : '—') + '</div>' +
        '<div class="stat-sub">' + (currentDone ? '来自 ' + q.label + ' 复盘' : '完成复盘后自动带出') + '</div></div>' +
      '<div class="card"><div class="stat-label">底线状态</div><div class="stat-value">' + (redCount ? '<span style="color:var(--red)">' + redCount + ' 项触发</span>' : (yellowCount ? '<span style="color:var(--yellow)">' + yellowCount + ' 项接近</span>' : '正常')) + '</div>' +
        '<div class="stat-sub">红 ' + redCount + ' · 黄 ' + yellowCount + ' · 绿 ' + greenCount + '</div></div>' +
      '<div class="card"><div class="stat-label">本周信息定投</div><div class="stat-value">' + weekMin + ' <span style="font-size:13px;color:var(--muted)">/ ' + weekGoal + ' 分</span></div>' +
        '<div class="bar mt-2"><i style="width:' + Math.min(100, weekGoal ? (weekMin / weekGoal) * 100 : 0) + '%"></i></div>' +
        '<div class="stat-sub"><button class="btn btn-xs" data-action="log-input">+30 分钟</button></div></div>' +
    '</div>';

    // ---- 年度目标
    html += '<div class="card section-gap"><div class="card-title"><h2>年度目标（' + active.length + ' / 2）</h2>' +
      '<div class="card-actions"><a class="btn btn-sm btn-ghost" href="#/goals">管理目标</a></div></div>';
    if (!active.length) {
      html += '<div class="empty" style="padding:22px"><div class="empty-title">还没有设定今年目标</div>' +
        '<div class="small">每年只定 1–2 个核心成长目标，多出来的进放弃清单。</div>' +
        '<a class="btn mt-3" href="#/goals">去立项</a></div>';
    } else {
      html += active.map(function (g) {
        var prog = C.goalProgress(g);
        return '<div class="flex-between" style="padding:10px 0;border-bottom:1px solid var(--border)">' +
          '<div style="min-width:0"><div style="font-weight:600">' + esc(g.title) + '</div>' +
          '<div class="small muted" style="margin-top:2px">下一步：' + esc(C.goalNextAction(g)) + '</div></div>' +
          '<div class="flex-gap">' + enumBadge(C.ENUMS.goalStatus, g.status) +
          (prog != null ? '<span class="small muted tabular">' + Math.round(prog * 100) + '%</span>' : '') +
          '</div></div>';
      }).join('');
    }
    html += '</div>';

    // ---- 底线 + 雷达
    html += '<div class="grid grid-2 section-gap">';
    html += '<div class="card"><div class="card-title"><h2>底线</h2><a class="btn btn-sm btn-ghost" href="#/bottom">规则设置</a></div>';
    html += activeRules.map(function (rule) {
      var lastFlag = (rule.flags || []).slice(-1)[0];
      return '<div class="flex-between" style="padding:8px 0;border-bottom:1px solid var(--border)">' +
        '<div style="min-width:0"><div>' + esc(rule.title) + '</div>' +
        '<div class="tiny faint" style="margin-top:2px">' + esc(lastFlag ? lastFlag.detail : '还没有已完成的复盘数据') + '</div></div>' +
        ruleBadge(rule.status) + '</div>';
    }).join('');
    html += '</div>';

    var researching = radarItems.filter(function (w) { return w.status === 'researching'; });
    html += '<div class="card"><div class="card-title"><h2>赛道雷达</h2><a class="btn btn-sm btn-ghost" href="#/radar">打开雷达</a></div>' +
      '<div class="flex-gap" style="margin-bottom:12px">' +
        badge('观察中 ' + radarItems.filter(function (w) { return w.status === 'observing'; }).length, 'tone-muted') +
        badge('研究中 ' + researching.length, 'tone-accent') +
        badge('已进入 ' + radarItems.filter(function (w) { return w.status === 'entered'; }).length, 'tone-green') +
      '</div>' +
      (radarDue.length
        ? '<div class="small" style="color:var(--yellow)">' + radarDue.length + ' 条到回看时间：' + esc(radarDue.slice(0, 3).map(function (w) { return w.name; }).join('、')) + '</div>'
        : '<div class="small muted">' + (radarItems.length ? '暂无到期待回看的条目。' : '还没有观察条目。') + '</div>') +
      '<div class="small muted mt-3">新赛道先在「观察中」待满 30 天再升级，避免 FOMO 决策。</div>' +
    '</div>';
    html += '</div>';

    // ---- 上次复盘
    if (latest) {
      html += '<div class="card section-gap"><div class="card-title"><h2>上次复盘 · ' + esc(latest.quarter) + '</h2>' +
        '<div class="card-actions">' + enumBadge(C.ENUMS.conclusion, latest.conclusion) + '</div></div>' +
        '<div class="small muted">' + esc(latest.oneLineSummary || '') + '</div>' +
        '<div class="mt-3 small"><span class="faint">下季 Top1：</span>' + esc(latest.topOne || '—') + '</div></div>';
    }

    view.innerHTML = html;
  }

  function alertBlock(tone, title, desc, actions) {
    return '<div class="alert alert-' + tone + '"><div class="alert-main">' +
      '<div class="alert-title">' + esc(title) + '</div>' +
      '<div class="alert-desc">' + desc + '</div></div>' +
      (actions ? '<div class="alert-actions">' + actions + '</div>' : '') + '</div>';
  }

  // ================================================================ 季度复盘：列表
  function renderReviews(view) {
    var data = state.data;
    var reviews = data.reviews.slice().sort(function (a, b) { return C.quarterIndex(b.quarter) - C.quarterIndex(a.quarter); });
    var done = C.completedReviewsChron(data);
    var html = pageHead('季度复盘', '每季度一次，四本账 + 一个结论。已完成 ' + done.length + ' 个季度',
      '<button class="btn btn-primary" data-action="new-review">新建复盘</button>');

    if (!reviews.length) {
      html += '<div class="card"><div class="empty"><div class="empty-title">还没有复盘记录</div>' +
        '<div class="small">复盘只要做一件事：用固定字段把四本账过一遍，最后写下结论。</div>' +
        '<button class="btn btn-primary mt-3" data-action="new-review">开始第一次复盘</button></div></div>';
    } else {
      html += '<div class="card"><div class="table-wrap"><table class="table"><thead><tr>' +
        '<th>季度</th><th>状态</th><th>结论</th><th class="num">有效时薪</th><th class="num">安全垫</th><th>底线</th><th>更新时间</th><th class="actions">操作</th>' +
        '</tr></thead><tbody>';
      html += reviews.map(function (r) {
        var m = C.reviewMetrics(r);
        var status = r.status === 'done' ? badge('已完成', 'tone-green') : badge('草稿', 'tone-muted');
        var bl = r.bottomLine || {};
        var blHtml = ['growth', 'health', 'salary'].map(function (k) {
          var v = bl[k];
          return v ? '<span class="badge ' + statusTone(v) + '" style="padding:1px 6px;font-size:11px">' + ({ growth: '成长', health: '健康', salary: '薪资' }[k]) + '</span>' : '';
        }).join(' ');
        return '<tr>' +
          '<td><a href="#/review/' + r.id + '"><b>' + esc(r.quarter) + '</b></a>' +
            '<div class="tiny faint">' + esc(C.quarterRangeText(r.quarter)) + '</div></td>' +
          '<td>' + status + '</td>' +
          '<td>' + (r.conclusion ? enumBadge(C.ENUMS.conclusion, r.conclusion) : '—') + '</td>' +
          '<td class="num">' + (m.effectiveHourly != null ? C.fmtMoney(m.effectiveHourly) : '—') + '</td>' +
          '<td class="num">' + (m.runwayMonths != null ? m.runwayMonths.toFixed(1) + ' 月' : '—') + '</td>' +
          '<td>' + (blHtml || '—') + '</td>' +
          '<td class="muted small">' + esc(C.fmtShortDate(r.updatedAt || r.createdAt)) + '</td>' +
          '<td class="actions">' +
            '<a class="btn btn-sm btn-ghost" href="#/review/' + r.id + '">' + (r.status === 'done' ? '查看' : '继续填写') + '</a> ' +
            '<button class="btn btn-sm btn-ghost" data-action="delete-review" data-id="' + r.id + '">删除</button>' +
          '</td></tr>';
      }).join('');
      html += '</tbody></table></div></div>';
    }

    // ---- 历史对比
    if (done.length >= 2) {
      html += '<div class="card section-gap"><div class="card-title"><h2>历史对比（最近 4 个完成季度）</h2>' +
        '<div class="card-actions"><button class="btn btn-sm btn-ghost" data-action="toggle-compare">' + (state.showCompare ? '收起' : '展开') + '</button></div></div>';
      if (state.showCompare) {
        html += compareTable(done.slice(-4));
      } else {
        html += '<div class="small muted">并排看关键数字的变化，比记住“上季感觉如何”可靠。</div>';
      }
      html += '</div>';
    }

    view.innerHTML = html;
  }

  function compareTable(reviews) {
    var rows = [
      { label: '月均总收入', get: function (m) { return C.fmtMoney(m.income.total); } },
      { label: '有效时薪', get: function (m) { return m.effectiveHourly != null ? C.fmtMoney(m.effectiveHourly) : '—'; } },
      { label: '技能投入', get: function (m) { return C.fmtNum(m.skillHours, 0) + ' h'; } },
      { label: '证据条数', get: function (m) { return m.evidenceCount + ' 条'; } },
      { label: '现金存款', get: function (m) { return C.fmtMoney(m.finance.cash); } },
      { label: '储蓄率', get: function (m) { return m.savingRate != null ? C.fmtPct(m.savingRate) : '—'; } },
      { label: '安全垫', get: function (m) { return m.runwayMonths != null ? m.runwayMonths.toFixed(1) + ' 月' : '—'; } },
      { label: '主业收益判断', get: function (m, r) { return C.enumLabel(C.ENUMS.incomeJudgement, r.income.judgement); } },
      { label: '技能判断', get: function (m, r) { return C.enumLabel(C.ENUMS.skillJudgement, r.skills.judgement); } },
      { label: '风险判断', get: function (m, r) { return C.enumLabel(C.ENUMS.riskJudgement, r.risk.judgement); } }
    ];
    var html = '<div class="table-wrap"><table class="table"><thead><tr><th>指标</th>' +
      reviews.map(function (r) { return '<th class="num">' + esc(r.quarter) + '</th>'; }).join('') + '</tr></thead><tbody>';
    rows.forEach(function (row) {
      html += '<tr><td class="muted">' + row.label + '</td>' + reviews.map(function (r) {
        return '<td class="num">' + esc(row.get(C.reviewMetrics(r), r)) + '</td>';
      }).join('') + '</tr>';
    });
    html += '</tbody></table></div>';
    return html;
  }

  // ---------------------------------------------------------------- 新建复盘
  function latestDoneBefore(label) {
    var target = C.quarterIndex(label);
    var before = C.completedReviewsChron(state.data).filter(function (r) { return C.quarterIndex(r.quarter) < target; });
    return before[before.length - 1] || null;
  }

  function createReview(quarterLabel) {
    var prev = latestDoneBefore(quarterLabel);
    var settings = state.data.settings;
    var review = {
      id: C.uid('rv'),
      quarter: quarterLabel,
      status: 'draft',
      createdAt: nowISO(),
      updatedAt: nowISO(),
      income: {
        main: prev ? prev.income.main : null,
        side: prev ? prev.income.side : null,
        other: prev ? prev.income.other : 0,
        monthlyHours: prev ? prev.income.monthlyHours : null,
        marketMonthlyMedian: (prev && prev.income.marketMonthlyMedian) || settings.marketMedianSalary || null,
        salaryEvent: '',
        judgement: ''
      },
      skills: {
        hours: null,
        items: [{ name: '', level: 3, evidence: '', keep: true }],
        transferability: prev ? prev.skills.transferability : '',
        judgement: ''
      },
      finance: {
        cash: prev ? prev.finance.cash : null,
        monthlyExpense: prev ? prev.finance.monthlyExpense : null,
        debts: prev && prev.finance.debts ? JSON.parse(JSON.stringify(prev.finance.debts)) : [],
        judgement: ''
      },
      risk: {
        socialSecurity: prev ? prev.risk.socialSecurity : 'continuous',
        socialSecurityCheckedAt: C.todayISO(),
        health: {
          abnormalExamItems: prev ? prev.risk.health.abnormalExamItems : 0,
          workoutPerWeek: prev ? prev.risk.health.workoutPerWeek : null,
          lateNightsPerWeek: prev ? prev.risk.health.lateNightsPerWeek : null
        },
        careerRisk: prev ? prev.risk.careerRisk : '',
        legalNotes: '',
        judgement: ''
      },
      conclusion: '',
      topOne: '',
      abandonList: '',
      oneLineSummary: ''
    };
    state.data.reviews.push(review);
    persist();
    goto('#/review/' + review.id);
    return review;
  }

  function openQuarterPicker() {
    var candidates = C.recentQuarterLabels(6, new Date(), state.data.settings.quarterStartMonth).filter(function (label) {
      return !state.data.reviews.some(function (r) { return r.quarter === label; });
    });
    if (!candidates.length) { toast('最近 6 个季度都已有复盘记录', 'error'); return; }
    var body = '<div class="small muted" style="margin-bottom:12px">选择要复盘的季度（只能补最近 6 个季度）：</div>' +
      '<div class="stack">' + candidates.map(function (label, i) {
        return '<label class="flex-gap" style="display:flex;padding:10px 12px;border:1px solid var(--border);border-radius:10px;cursor:pointer">' +
          '<input type="radio" name="pick-quarter" value="' + label + '"' + (i === 0 ? ' checked' : '') + ' style="accent-color:var(--accent)">' +
          '<b>' + esc(label) + '</b><span class="small muted">' + esc(C.quarterRangeText(label)) + '</span></label>';
      }).join('') + '</div>';
    openModal({
      title: '新建季度复盘',
      body: body,
      footer: '<button type="button" class="btn" data-close>取消</button><button type="button" class="btn btn-primary" id="pick-ok">开始复盘</button>',
      onMount: function (ov) {
        ov.querySelector('[data-close]').addEventListener('click', function () { closeModal(ov); });
        ov.querySelector('#pick-ok').addEventListener('click', function () {
          var picked = ov.querySelector('input[name="pick-quarter"]:checked');
          if (!picked) return;
          closeModal(ov);
          createReview(picked.value);
        });
      }
    });
  }

  // ================================================================ 季度复盘：录入
  function getReview(id) { return state.data.reviews.filter(function (r) { return r.id === id; })[0] || null; }

    var review = getReview(id);
    if (!review) { toast('复盘记录不存在', 'error'); goto('#/reviews'); return; }
    state.editingReviewId = review.id;
    var data = state.data;
    var q = C.parseQuarterLabel(review.quarter);
    var statusBadge = review.status === 'done' ? badge('已完成', 'tone-green') : badge('草稿', 'tone-muted');
    var prev = latestDoneBefore(review.quarter);

    var html = pageHead(review.quarter + ' 复盘', (q ? esc(q.fy + ' 年 · 第 ' + q.q + ' 季度') : '') + ' · ' + esc(C.quarterRangeText(review.quarter)),
      '<button class="btn btn-ghost" data-action="back-reviews">返回列表</button>' + statusBadge);

    html += '<div class="hidden error-list" id="form-errors"></div>';

    // ---------- 1 主业收益
    html += '<div class="section"><div class="section-head"><span class="section-num">1</span><h2>主业收益</h2>' +
      '<span class="section-hint">' + (prev ? '已带出 ' + prev.quarter + ' 数据，请更新' : '首次录入') + '</span></div>' +
      '<div class="form-grid">' +
      fieldWrap('主业月均收入', numControl('income.main', review.income.main), { req: true }) +
      fieldWrap('副业月均收入', numControl('income.side', review.income.side), { req: true }) +
      fieldWrap('其他收入', numControl('income.other', review.income.other), { req: true }) +
      fieldWrap('月均总工时（含通勤/加班）', numControl('income.monthlyHours', review.income.monthlyHours), { req: true, hint: '用于计算有效时薪，估算即可' }) +
      fieldWrap('市场同岗位月薪中位数', numControl('income.marketMonthlyMedian', review.income.marketMonthlyMedian), { hint: '每季度手动更新一次，薪资底线规则要用' }) +
      fieldWrap('涨薪/跳槽节点', selectControl('income.salaryEvent', review.income.salaryEvent, C.ENUMS.salaryEvent), { req: true }) +
      fieldWrap('收益判断', radiosControl('income.judgement', review.income.judgement, C.ENUMS.incomeJudgement) + '<div class="hint" id="sug-income"></div>', { span: true, req: true }) +
      '</div>' +
      '<div class="calc" id="calc-income"></div></div>';

    // ---------- 2 技能积累
    html += '<div class="section"><div class="section-head"><span class="section-num">2</span><h2>技能积累</h2>' +
      '<span class="section-hint">判断标准：有证据才算积累</span></div>' +
      '<div class="form-grid">' +
      fieldWrap('本季投入时长（小时）', numControl('skills.hours', review.skills.hours), { req: true }) +
      fieldWrap('可迁移性', selectControl('skills.transferability', review.skills.transferability, C.ENUMS.transferability), { req: true }) +
      '</div>' +
      '<div class="field span-2"><label>技能条目（建议 1–3 条）</label>' +
        '<div class="rows" id="skill-rows">' + skillRowsHtml(review) + '</div>' +
        '<div class="mt-2"><button type="button" class="btn btn-sm" data-form-action="add-skill">+ 添加技能</button></div>' +
      '</div>' +
      fieldWrap('技能积累判断', radiosControl('skills.judgement', review.skills.judgement, C.ENUMS.skillJudgement) + '<div class="hint" id="sug-skills"></div>', { span: true, req: true }) +
      '<div class="calc" id="calc-skills"></div></div>';

    // ---------- 3 存款与负债
    html += '<div class="section"><div class="section-head"><span class="section-num">3</span><h2>存款与负债</h2></div>' +
      '<div class="form-grid">' +
      fieldWrap('现金存款（可动用）', numControl('finance.cash', review.finance.cash), { req: true }) +
      fieldWrap('月均总支出', numControl('finance.monthlyExpense', review.finance.monthlyExpense), { req: true, hint: '安全垫 = 存款 ÷ 月均支出，用总支出偏保守' }) +
      '</div>' +
      '<div class="field span-2"><label>负债（没有可留空）</label>' +
        '<div class="rows" id="debt-rows">' + debtRowsHtml(review) + '</div>' +
        '<div class="mt-2"><button type="button" class="btn btn-sm" data-form-action="add-debt">+ 添加负债</button></div>' +
      '</div>' +
      fieldWrap('存款判断', radiosControl('finance.judgement', review.finance.judgement, C.ENUMS.financeJudgement) + '<div class="hint" id="sug-finance"></div>', { span: true, req: true }) +
      '<div class="calc" id="calc-finance"></div></div>';

      '<div class="form-grid">' +
      fieldWrap('社保/公积金', selectControl('risk.socialSecurity', review.risk.socialSecurity, C.ENUMS.socialSecurity), { req: true }) +
      fieldWrap('最近核对日期', dateControl('risk.socialSecurityCheckedAt', review.risk.socialSecurityCheckedAt), { req: true }) +
      fieldWrap('体检新增异常项', numControl('risk.health.abnormalExamItems', review.risk.health.abnormalExamItems), { req: true }) +
      fieldWrap('周均运动次数', numControl('risk.health.workoutPerWeek', review.risk.health.workoutPerWeek), { req: true }) +
      fieldWrap('周均熬夜天数', numControl('risk.health.lateNightsPerWeek', review.risk.health.lateNightsPerWeek), { req: true }) +
      fieldWrap('职业风险', selectControl('risk.careerRisk', review.risk.careerRisk, C.ENUMS.careerRisk), { req: true }) +

      fieldWrap('本季结论', radiosControl('conclusion', review.conclusion, C.ENUMS.conclusion) +
        '<div class="hint">选「启动退出评估」会提示你在底线页填写决策卡。</div>', { span: true, req: true }) +
      '<div class="form-grid">' +
      fieldWrap('本季一句话总结', textareaControl('oneLineSummary', review.oneLineSummary, { rows: 2, placeholder: '例如：收入稳定但技能证据不足，下季重点是作品化。' }), { span: true, req: true }) +
      fieldWrap('下季唯一最重要的事（Top 1）', textControl('topOne', review.topOne, { placeholder: '只能写一件事' }), { span: true, req: true }) +
      fieldWrap('本季放弃清单', textareaControl('abandonList', review.abandonList, { rows: 2, placeholder: '做了什么但其实不该做的，或主动放弃的事' }), { span: true }) +
      '</div>' +
      '<div class="calc">提交后会自动计算底线状态：' + ruleBadge('unknown') + ' 成长 · ' + ruleBadge('unknown') + ' 健康 · ' + ruleBadge('unknown') + ' 薪资</div></div>';

    // ---------- 操作条
    html += '<div class="action-bar">' +
      '<div class="left"><span id="autosave-note">' + (state.demo ? '演示模式：修改不会保存' : '编辑内容会自动保存') + '</span></div>' +
      '<button class="btn btn-ghost" data-action="delete-review" data-id="' + review.id + '">删除</button>' +
      '<button class="btn" data-action="back-reviews">返回列表</button>' +
      '<button class="btn btn-primary" data-form-action="submit-review">提交完成</button>' +
      '</div>';

    view.innerHTML = html;
