  }

  function skillRowsHtml(review) {
    var items = review.skills.items || [];
    if (!items.length) return '<div class="hint">还没有技能条目。建议每季只记录 1–3 个真正在练的技能。</div>';
    return items.map(function (it, i) {
      var levels = [1, 2, 3, 4, 5].map(function (lv) {
        return '<option value="' + lv + '"' + (C.n(it.level) === lv ? ' selected' : '') + '>L' + lv + '</option>';
      }).join('');
      return '<div class="row-line skill">' +
        '<input class="input" data-path="skills.items.' + i + '.name" value="' + esc(it.name) + '" placeholder="技能名">' +
        '<select class="input" data-path="skills.items.' + i + '.level" title="等级">' + levels + '</select>' +
        '<input class="input" data-path="skills.items.' + i + '.evidence" value="' + esc(it.evidence) + '" placeholder="证据：作品 / 证书 / 成果">' +
        '<label class="check-line"><input type="checkbox" data-path="skills.items.' + i + '.keep"' + (it.keep !== false ? ' checked' : '') + '>继续</label>' +
        '<button type="button" class="rm" data-form-action="rm-skill" data-index="' + i + '">×</button>' +
        '</div>';
    }).join('');
  }

  function debtRowsHtml(review) {
    var debts = review.finance.debts || [];
    if (!debts.length) return '<div class="hint">没有负债可留空。负债不是羞耻，是必须算进安全垫的变量。</div>';
    return debts.map(function (d, i) {
      var opts = C.ENUMS.debtType.map(function (t) {
        return '<option value="' + t.value + '"' + (t.value === d.type ? ' selected' : '') + '>' + esc(t.label) + '</option>';
      }).join('');
      return '<div class="row-line debt">' +
        '<select class="input" data-path="finance.debts.' + i + '.type">' + opts + '</select>' +
        '<input class="input" data-path="finance.debts.' + i + '.balance" type="number" value="' + (d.balance == null ? '' : esc(String(d.balance))) + '" placeholder="余额" min="0">' +
        '<input class="input" data-path="finance.debts.' + i + '.monthly" type="number" value="' + (d.monthly == null ? '' : esc(String(d.monthly))) + '" placeholder="月供" min="0">' +
        '<input class="input" data-path="finance.debts.' + i + '.rate" type="number" value="' + (d.rate == null ? '' : esc(String(d.rate))) + '" placeholder="利率%" step="0.01" min="0">' +
        '<button type="button" class="rm" data-form-action="rm-debt" data-index="' + i + '">×</button>' +
        '</div>';
    }).join('');
  }

  function onReviewInput(e) {
    var t = e.target;
    if (!t.dataset || t.dataset.path == null) return;
    var review = getReview(state.editingReviewId);
    if (!review) return;
    var type = (t.type || '').toLowerCase();
    var value;
    if (type === 'radio') { if (!t.checked) return; value = t.value; }
    else if (type === 'checkbox') value = t.checked;
    else if (type === 'number') value = C.nullableNum(t.value);
    else value = t.value;
    C.setByPath(review, t.dataset.path, value);
    review.updatedAt = nowISO();
    t.classList.remove('invalid');
    scheduleSave();
    refreshReviewCalc(review);
  }

  function onReviewClick(e) {
    var btn = e.target.closest('[data-form-action]');
    if (!btn) return;
    var review = getReview(state.editingReviewId);
    if (!review) return;
    var action = btn.dataset.formAction;
    if (action === 'add-skill') {
      if ((review.skills.items || []).length >= 5) { toast('技能条目最多 5 条', 'error'); return; }
      review.skills.items.push({ name: '', level: 3, evidence: '', keep: true });
      rerenderRow('#skill-rows', skillRowsHtml(review));
      refreshReviewCalc(review); scheduleSave();
    } else if (action === 'rm-skill') {
      review.skills.items.splice(parseInt(btn.dataset.index, 10), 1);
      rerenderRow('#skill-rows', skillRowsHtml(review));
      refreshReviewCalc(review); scheduleSave();
    } else if (action === 'add-debt') {
      review.finance.debts.push({ type: 'mortgage', balance: null, monthly: null, rate: null });
      rerenderRow('#debt-rows', debtRowsHtml(review));
      refreshReviewCalc(review); scheduleSave();
    } else if (action === 'rm-debt') {
      review.finance.debts.splice(parseInt(btn.dataset.index, 10), 1);
      rerenderRow('#debt-rows', debtRowsHtml(review));
      refreshReviewCalc(review); scheduleSave();
    } else if (action === 'suggest') {
      var kind = btn.dataset.suggest;
      var path = { income: 'income.judgement', skills: 'skills.judgement', finance: 'finance.judgement', risk: 'risk.judgement' }[kind];
      var m = C.reviewMetrics(review, state.data.settings);
      var val = m.suggestions[kind];
      if (!path || !val) return;
      var radio = document.querySelector('input[data-path="' + path + '"][value="' + val + '"]');
      C.setByPath(review, path, val);
      if (radio) radio.checked = true;
      scheduleSave();
      refreshReviewCalc(review);
      toast('已按数据建议选择');
    } else if (action === 'submit-review') {
      submitReview(review);
    }
  }

  function rerenderRow(selector, html) {
    var el = $(selector);
    if (el) el.innerHTML = html;
  }

  function suggestionHtml(kind, suggestion, review) {
    if (!suggestion) return '<span class="faint">数据不足，无法给出建议</span>';
    var label = kind === 'income' ? C.enumLabel(C.ENUMS.incomeJudgement, suggestion)
      : kind === 'skills' ? C.enumLabel(C.ENUMS.skillJudgement, suggestion)
      : kind === 'finance' ? C.enumLabel(C.ENUMS.financeJudgement, suggestion)
      : C.enumLabel(C.ENUMS.riskJudgement, suggestion);
    return '按数据建议：<b style="color:var(--text)">' + esc(label) + '</b> ' +
      '<button type="button" class="btn btn-xs" data-form-action="suggest" data-suggest="' + kind + '">应用</button>';
  }

  function refreshReviewCalc(review) {
    if (!review || !document.getElementById('calc-income')) return;
    var m = C.reviewMetrics(review, state.data.settings);
    var inc = m.income;
    var fin = m.finance;
    var incomeCalc = $('#calc-income');
    if (incomeCalc) {
      incomeCalc.innerHTML =
        ksItem('月均总收入', C.fmtMoney(inc.total)) +
        ksItem('有效时薪', inc.effectiveHourly != null ? C.fmtMoney(inc.effectiveHourly) : '—') +
        (inc.structure ? ksItem('收入结构', C.fmtPct(inc.structure.main, 0) + ' / ' + C.fmtPct(inc.structure.side, 0) + ' / ' + C.fmtPct(inc.structure.other, 0) + '（主业/副业/其他）') : '');
    }
    var skillsCalc = $('#calc-skills');
    if (skillsCalc) {
      skillsCalc.innerHTML =
        ksItem('技能投入', C.fmtNum(m.skillHours, 0) + ' h') +
        ksItem('有证据条目', m.evidenceCount + ' / ' + ((review.skills.items || []).filter(function (i) { return String(i.name || '').trim(); }).length || 0)) +
        (m.skillHours > 0 && m.evidenceCount === 0 ? '<span class="warn">⚠ 练习未沉淀：投入了时间但没有可展示证据</span>' : '');
    }
    var financeCalc = $('#calc-finance');
    if (financeCalc) {
      financeCalc.innerHTML =
        ksItem('储蓄率', m.savingRate != null ? C.fmtPct(m.savingRate) : '—') +
        ksItem('安全垫', m.runwayMonths != null ? m.runwayMonths.toFixed(1) + ' 个月' : '—') +
        ksItem('负债合计', C.fmtMoney(m.debtBalance));
    }
    var sugIncome = $('#sug-income'); if (sugIncome) sugIncome.innerHTML = suggestionHtml('income', m.suggestions.income, review);
    var sugSkills = $('#sug-skills'); if (sugSkills) sugSkills.innerHTML = suggestionHtml('skills', m.suggestions.skills, review);
    var sugFinance = $('#sug-finance'); if (sugFinance) sugFinance.innerHTML = suggestionHtml('finance', m.suggestions.finance, review);
    var sugRisk = $('#sug-risk'); if (sugRisk) sugRisk.innerHTML = suggestionHtml('risk', m.suggestions.risk, review);
  }

  function submitReview(review) {
    var errors = C.validateReview(review);
    var view = $('#view');
    showErrors(view, errors);
    markInvalid(view, errors);
    if (errors.length) {
      toast('还有 ' + errors.length + ' 处需要补全', 'error');
      return;
    }
    review.status = 'done';
    review.completedAt = nowISO();
    review.updatedAt = nowISO();
    // 快照底线状态
    var rules = getRules();
    review.bottomLine = {};
    rules.forEach(function (r) { review.bottomLine[r.type] = r.status; });
    persist();
    toast('复盘已提交，底线状态已更新');
    goto('#/reviews');
  }

  // ================================================================ 年度目标
  function currentFy() { return C.currentQuarter(new Date(), state.data.settings.quarterStartMonth).fy; }

  function renderGoals(view) {
    var data = state.data;
    var year = currentFy();
    var active = C.activeGoals(data.goals, year);
    var html = pageHead('年度目标', '每年只允许 1–2 个核心目标 · 当前 ' + year + ' 年',
      '<button class="btn btn-primary" data-action="add-goal">新增目标</button>');

    // 年中校准
    var month = new Date().getMonth() + 1;
    if (month >= 7 && month <= 9) {
      var needCal = active.some(function (g) { return !g.midYearCheck; });
      if (needCal) {
        html += alertBlock('blue', '年中校准（7 月）', '目标需要一次三选一：继续 / 降级为维持 / 正式放弃。',
          '<button class="btn btn-sm" data-action="midyear">开始校准</button>');
      }
    }
    if (month >= 11 || month <= 2) {
      html += alertBlock('muted', '年末结项', '给今年的目标打分并归档，形成年度快照。',
        '<button class="btn btn-sm" data-action="yearend">开始结项</button>');
    }
    // 往年未结项目标
    var olderYears = {};
    data.goals.forEach(function (g) {
      if ((g.status === 'active' || g.status === 'maintained') && g.year < year) olderYears[g.year] = true;
    });
    Object.keys(olderYears).forEach(function (y) {
      html += alertBlock('yellow', y + ' 年目标未结项', '上一年度的目标需要结项或归档后才能保持一年 1–2 个目标的约束。',
        '<button class="btn btn-sm" data-action="yearend-year" data-id="' + y + '">结项 ' + y + ' 年目标</button>');
    });

    // 进行中
    html += '<div class="card"><div class="card-title"><h2>进行中（' + active.length + ' / 2）</h2>' +
      '<span class="small muted">新增第 3 个前必须先归档一个</span></div>';
    if (!active.length) {
      html += '<div class="empty" style="padding:26px"><div class="empty-title">还没有今年的核心目标</div>' +
        '<div class="small">一年只定 1–2 个。写不出可验证的完成标准，就还不能立项。</div>' +
        '<button class="btn btn-primary mt-3" data-action="add-goal">开始立项</button></div>';
    } else {
      html += active.map(function (g) { return goalCardHtml(g, true); }).join('');
    }
    html += '</div>';

    // 放弃清单
    var dropped = data.goals.filter(function (g) { return g.status === 'dropped'; });
    html += '<div class="card section-gap"><div class="card-title"><h2>放弃清单（' + dropped.length + '）</h2>' +
      '<span class="small muted">主动放弃也是决策，记下来</span></div>';
    if (!dropped.length) {
      html += '<div class="small muted">还没有放弃的目标。</div>';
    } else {
      html += dropped.sort(function (a, b) { return (b.droppedAt || '') > (a.droppedAt || '') ? 1 : -1; }).map(function (g) {
        return '<div style="padding:10px 0;border-bottom:1px solid var(--border)">' +
          '<div class="flex-between"><div><span style="color:var(--faint);text-decoration:line-through">' + esc(g.title) + '</span>' +
          '<span class="tiny faint" style="margin-left:8px">' + esc(g.year) + ' 年</span></div>' +
          '<button class="btn btn-xs btn-ghost" data-action="restore-goal" data-id="' + g.id + '">恢复</button></div>' +
          (g.dropReason ? '<div class="small muted" style="margin-top:2px">原因：' + esc(g.dropReason) + '</div>' : '') +
          '</div>';
      }).join('');
    }
    html += '</div>';

    // 已达成
    var achieved = data.goals.filter(function (g) { return g.status === 'achieved'; });
    if (achieved.length) {
      html += '<div class="card section-gap"><div class="card-title"><h2>已达成（' + achieved.length + '）</h2></div>' +
        achieved.map(function (g) {
          return '<div class="flex-between" style="padding:9px 0;border-bottom:1px solid var(--border)">' +
            '<div>' + esc(g.title) + (g.yearEndScore != null ? ' <span class="small muted">自评 ' + g.yearEndScore + ' 分</span>' : '') + '</div>' +
            '<button class="btn btn-xs btn-ghost" data-action="delete-goal" data-id="' + g.id + '">删除</button></div>';
        }).join('') + '</div>';
    }

    // 历史年份
    var older = data.goals.filter(function (g) { return g.year < year; });
    if (older.length) {
      html += '<div class="card section-gap"><div class="card-title"><h2>往年目标</h2></div>' +
        older.sort(function (a, b) { return b.year - a.year; }).map(function (g) {
          return '<div class="flex-between small" style="padding:7px 0;border-bottom:1px solid var(--border)">' +
            '<span>' + esc(g.year) + ' · ' + esc(g.title) + '</span>' + enumBadge(C.ENUMS.goalStatus, g.status) + '</div>';
        }).join('') + '</div>';
    }

    view.innerHTML = html;
  }

  function goalCardHtml(g, showActions) {
    var prog = C.goalProgress(g);
    var krs = (g.keyResults || []).filter(function (k) { return String(k.text || '').trim(); });
    var html = '<div class="goal">' +
      '<div class="goal-head"><div style="min-width:0">' +
        '<div class="goal-title">' + esc(g.title) + '</div>' +
        '<div class="goal-sub">截止 ' + esc(C.fmtDate(g.deadline)) + ' · 预算 ' + (g.budget && g.budget.hoursPerWeek ? g.budget.hoursPerWeek + ' h/周' : '—') +
        ' · ' + (g.budget && g.budget.money ? C.fmtMoney(g.budget.money) : '—') + '</div>' +
      '</div><div class="goal-actions">' + enumBadge(C.ENUMS.goalStatus, g.status) +
      '<button class="btn btn-sm" data-action="update-kr" data-id="' + g.id + '">更新进度</button>' +
      '<button class="btn btn-sm btn-ghost" data-action="edit-goal" data-id="' + g.id + '">编辑</button>' +
      '<button class="btn btn-sm btn-ghost" data-action="goal-achieved" data-id="' + g.id + '">标记达成</button>' +
      '<button class="btn btn-sm btn-ghost" data-action="goal-drop" data-id="' + g.id + '">放弃</button>' +
      '</div></div>' +
      '<div class="goal-def"><b>完成标准：</b>' + esc(g.definitionOfDone) + '</div>' +
      (g.antiGoals ? '<div class="goal-def"><b>反目标：</b>' + esc(g.antiGoals) + '</div>' : '') +
      (krs.length ? '<div class="kr-list">' + krs.map(function (k) {
        var pct = C.n(k.target) > 0 ? C.clamp(C.n(k.current) / C.n(k.target), 0, 1) : 0;
        return '<div class="kr"><div class="kr-text">' + esc(k.text) + '</div>' +
          '<div class="kr-bar"><i style="width:' + pct * 100 + '%"></i></div>' +
          '<div class="kr-num">' + C.fmtNum(C.n(k.current)) + ' / ' + C.fmtNum(C.n(k.target)) + '</div></div>';
      }).join('') + '</div>' : '') +
      (prog != null ? '<div class="small muted mt-2">整体进度 ' + Math.round(prog * 100) + '%</div>' : '') +
      '</div>';
    return html;
  }

  function openGoalEditor(existing, presetStatus) {
    var year = currentFy();
    var draft = existing ? JSON.parse(JSON.stringify(existing)) : {
      id: C.uid('g'), year: year, title: '', definitionOfDone: '',
      keyResults: [{ text: '', target: null, current: 0 }], deadline: year + '-12-31',
      antiGoals: '', budget: { hoursPerWeek: null, money: null },
      status: 'active', createdAt: nowISO(), updatedAt: nowISO()
    };
    var body = '<div class="hidden error-list" id="goal-errors"></div>' +
      fieldWrap('目标名', textControl('title', draft.title, { placeholder: '一句话说清楚' }), { req: true }) +
      fieldWrap('完成标准（必须可验证）', textareaControl('definitionOfDone', draft.definitionOfDone, { rows: 2, placeholder: '例如：连续 3 个月副业收入 ≥ 5000 元' }), { req: true }) +
      fieldWrap('截止时间', dateControl('deadline', draft.deadline), { req: true }) +
      '<div class="field"><label>关键结果（最多 3 条，每条带数字目标）</label>' +
        '<div class="rows" id="goal-kr-rows"></div>' +
        '<div class="mt-2"><button type="button" class="btn btn-sm" id="goal-add-kr">+ 添加关键结果</button></div>' +
      '</div>' +
      fieldWrap('反目标（为达成它，明确不做什么）', textControl('antiGoals', draft.antiGoals, { placeholder: '例如：不接与主业冲突的项目' })) +
      '<div class="form-grid">' +
      fieldWrap('时间预算（小时/周）', numControl('budget.hoursPerWeek', draft.budget.hoursPerWeek)) +
      fieldWrap('金钱预算（元）', numControl('budget.money', draft.budget.money)) +
      '</div>';
    var ov = openModal({
      title: existing ? '编辑目标' : '新增年度目标',
      body: body,
      wide: true,
      footer: '<button type="button" class="btn" data-close>取消</button>' +
        '<button type="button" class="btn btn-primary" id="goal-save">保存</button>',
      onMount: function (o) {
        var bodyEl = o.querySelector('.modal-body');
        function renderKrs() {
          var rows = o.querySelector('#goal-kr-rows');
          rows.innerHTML = draft.keyResults.map(function (k, i) {
            return '<div class="row-line" style="grid-template-columns:1fr 110px 110px auto">' +
              '<input class="input kr-text" value="' + esc(k.text || '') + '" placeholder="关键结果">' +
              '<input class="input kr-target" type="number" value="' + (k.target == null ? '' : esc(String(k.target))) + '" placeholder="目标数字" min="0">' +
              '<input class="input kr-current" type="number" value="' + (k.current == null ? '' : esc(String(k.current))) + '" placeholder="当前进度" min="0">' +
              '<button type="button" class="rm" data-rm-kr="' + i + '">×</button>' +
              '</div>';
          }).join('');
        }
        renderKrs();
        o.querySelector('#goal-add-kr').addEventListener('click', function () {
          if (draft.keyResults.length >= 3) { toast('关键结果最多 3 条', 'error'); return; }
          draft.keyResults.push({ text: '', target: null, current: 0 });
          renderKrs();
        });
        o.querySelector('#goal-kr-rows').addEventListener('click', function (e) {
          var btn = e.target.closest('[data-rm-kr]');
          if (!btn) return;
          draft.keyResults.splice(parseInt(btn.dataset.rmKr, 10), 1);
          renderKrs();
        });
        o.querySelector('[data-close]').addEventListener('click', function () { closeModal(o); });
        o.querySelector('#goal-save').addEventListener('click', function () {
          readFields(bodyEl, draft);
          draft.keyResults = $$('#goal-kr-rows .row-line', o).map(function (row) {
            return {
              text: row.querySelector('.kr-text').value.trim(),
              target: C.nullableNum(row.querySelector('.kr-target').value),
              current: C.nullableNum(row.querySelector('.kr-current').value) || 0
            };
          }).filter(function (k) { return k.text; });
          var errors = C.validateGoal(draft);
          showErrors(o, errors);
          if (errors.length) { toast('目标信息不完整', 'error'); return; }
          draft.updatedAt = nowISO();
          if (existing) {
            var idx = state.data.goals.findIndex(function (g) { return g.id === existing.id; });
            if (idx >= 0) state.data.goals[idx] = draft;
          } else {
            draft.createdAt = nowISO();
            state.data.goals.push(draft);
          }
          persist();
          closeModal(o);
          toast(existing ? '目标已更新' : '目标已立项');
          render();
        });
      }
    });
    return ov;
  }

      active.map(function (g, i) {

          '<input type="radio" name="drop-goal" value="' + g.id + '"' + (i === 0 ? ' checked' : '') + ' style="accent-color:var(--accent)">' +
          '<span>' + esc(g.title) + '</span></label>';
      }).join('') +
      fieldWrap('放弃原因', textControl('reason', '', { placeholder: '写下为什么放弃，避免以后重复立项' }), { req: true });
    openModal({
      title: '需要先归档一个目标',
      body: body,
      footer: '<button type="button" class="btn" data-close>取消</button>' +

          var picked = o.querySelector('input[name="drop-goal"]:checked');

  function openMidYearModal() {
    var year = currentFy();
    var active = C.activeGoals(state.data.goals, year);
    var body = active.map(function (g) {
      return '<div style="padding:12px 0;border-bottom:1px solid var(--border)">' +
        '<div style="font-weight:600;margin-bottom:8px">' + esc(g.title) + '</div>' +
        radiosControl('mid_' + g.id, '', C.ENUMS.midYear) +
        '</div>';
    }).join('');
    openModal({
      title: '年中校准（7 月）',
      body: body + '<div class="hint mt-3">降级 = 目标仍存在但不作为核心优先级；放弃 = 正式写入放弃清单，需写原因（可在下一步补充）。</div>',

        o.querySelector('#mid-ok').addEventListener('click', function () {
          active.forEach(function (g) {
            var radios = o.querySelectorAll('input[data-path="mid_' + g.id + '"]');

          });
          persist();
          closeModal(o);
          toast('年中校准已记录');
          render();
        });
      }
    });

          ['active', 'achieved', 'dropped'].map(function (s) {

        '</div>' +
        '<div class="field"><label>一句话归因</label><input class="input" data-note="' + g.id + '" value="' + esc(g.yearEndNote || '') + '" placeholder="为什么达成 / 为什么没达成"></div>' +

      footer: '<button type="button" class="btn" data-close>取消</button><button type="button" class="btn btn-primary" id="ye-ok">提交结项</button>',
      onMount: function (o) {
        o.querySelector('[data-close]').addEventListener('click', function () { closeModal(o); });
        o.querySelector('#ye-ok').addEventListener('click', function () {
          goals.forEach(function (g) {
            var scoreEl = o.querySelector('[data-score="' + g.id + '"]');
            var statusEl = o.querySelector('[data-status="' + g.id + '"]');
            var noteEl = o.querySelector('[data-note="' + g.id + '"]');
            g.yearEndScore = C.nullableNum(scoreEl.value);
            g.yearEndNote = noteEl.value.trim();

            if (g.status === 'achieved') g.achievedAt = g.achievedAt || C.todayISO();
            g.updatedAt = nowISO();
          });
          persist();
          closeModal(o);
          toast('年末结项已保存');
          render();
        });
      }
    });
  }

  // ================================================================ 底线
  function getRawRule(ruleId) { return (state.data.bottomLines || []).filter(function (r) { return r.id === ruleId; })[0] || null; }

  function renderBottom(view) {
    var rules = getRules();
    var html = pageHead('底线', '预先写好退出条件，避免在情绪和沉没成本里做决定');
    html += '<div class="card"><div class="card-title"><h2>底线规则</h2><span class="small muted">季度复盘时自动计算状态</span></div>' +
      rules.map(function (r) { return ruleCardHtml(r); }).join('') + '</div>';
    html += '<div class="card section-gap"><div class="card-title"><h2>这套规则怎么用</h2></div>' +
      '<div class="small muted" style="line-height:1.9">' +
      '1. 绿色 = 未触达；黄色 = 接近阈值；红色 = 触达。<br>' +
      '2. 红色不是让你立刻辞职，而是必须填一张决策卡：设定期限观望 / 启动准备 / 执行退出。<br>' +
      '3. 决策卡提交后状态不再反复摇摆；到复查日期再评估。<br>' +
      '4. 阈值可以按你的实际情况调整，改完立即按已有复盘数据重新计算。</div></div>';
    view.innerHTML = html;
  }

  function handleRuleThresholdChange(e) {
    var el = e.target.closest('[data-rule-field]');
    if (!el) return;
    var rule = getRawRule(el.dataset.ruleId);
    if (!rule) return;
    var val = C.nullableNum(el.value);
    if (val == null) return;
    rule.threshold[el.dataset.ruleField] = val;
    persist();
    toast('阈值已更新，状态已重算');
    render();
  }

  function ruleCardHtml(rule) {
    var meta = C.RULE_META[rule.type] || { title: rule.title, desc: '', fields: [] };
    var raw = getRawRule(rule.ruleId);
    var flags = rule.flags || [];
    var html = '<div class="rule">' +
      '<div class="rule-head"><div><div class="rule-title">' + esc(meta.title) + '</div>' +
      '<div class="rule-desc">' + esc(meta.desc) + '</div></div>' +
      '<div class="rule-actions">' + ruleBadge(rule.status) +
      (rule.status === 'red' && !rule.decision ? '<button class="btn btn-sm btn-primary" data-action="open-decision" data-id="' + rule.ruleId + '">填写决策卡</button>' : '') +
      (rule.status === 'red' && rule.decision ? '<button class="btn btn-sm btn-ghost" data-action="review-decision" data-id="' + rule.ruleId + '">标记已复查</button>' : '') +
      '</div></div>' +
      '<div class="rule-threshold">' + (meta.fields || []).map(function (f) {
        return '<span class="th-field"><span>' + esc(f.label) + '</span>' +
          '<input class="input" type="number" data-rule-id="' + raw.id + '" data-rule-field="' + f.key + '"' +
          ' value="' + (raw.threshold[f.key] == null ? '' : raw.threshold[f.key]) + '"' +
          (f.min != null ? ' min="' + f.min + '"' : '') + (f.max != null ? ' max="' + f.max + '"' : '') +
          (f.step ? ' step="' + f.step + '"' : '') + '>' +
          '<span class="faint">' + esc(f.suffix || '') + '</span></span>';
      }).join('') + '</div>' +
      (flags.length ? '<div class="rule-evidence">' + flags.map(function (f) {
        var cls = f.bad === true ? 'red' : f.bad === false ? 'green' : 'yellow';
        return '<div class="flag ' + cls + '">' + esc(f.detail) + '</div>';
      }).join('') + '</div>' : '') +
      (rule.decision ? decisionHtml(rule) : '') +
      '</div>';
    return html;
  }

  function decisionHtml(rule) {
    var d = rule.decision;
    var overdue = rule.decisionOverdue;
    return '<div class="decision' + (overdue ? ' overdue' : '') + '">' +
      '<div><b>' + esc(C.enumLabel(C.ENUMS.decisionChoice, d.choice)) + '</b>' +
      (overdue ? ' <span class="badge tone-yellow">已过复查日期</span>' : '') + '</div>' +
      '<div class="d-line">理由：' + esc(d.reason) + '</div>' +
      '<div class="d-line">决策时间：' + esc(C.fmtDate(d.createdAt)) + ' · 截止/复查：<b>' + esc(C.fmtDate(d.deadline)) + '</b></div>' +
      '</div>';
  }

  function openDecisionCard(ruleId) {
    var rule = getRawRule(ruleId);
    var computed = getRules().filter(function (r) { return r.ruleId === ruleId; })[0];
    if (!rule || !computed) return;
    var meta = C.RULE_META[rule.type] || { title: rule.title };
    var draft = { choice: '', reason: '', deadline: C.isoDate(new Date(Date.now() + 60 * 86400000)) };
    var evidence = (computed.flags || []).filter(function (f) { return f.bad !== false; }).slice(-3);
    var body = '<div class="alert alert-red" style="margin-bottom:16px"><div class="alert-main">' +
      '<div class="alert-title">' + esc(meta.title) + ' 已触发</div>' +
      '<div class="alert-desc">' + evidence.map(function (f) { return esc(f.detail); }).join('<br>') + '</div></div></div>' +
      fieldWrap('你的选择', radiosControl('choice', '', C.ENUMS.decisionChoice), { req: true }) +
      fieldWrap('理由（写给自己看）', textareaControl('reason', '', { rows: 3, placeholder: '为什么选这个？约束条件是什么？' }), { req: true }) +
      fieldWrap('截止 / 复查日期', dateControl('deadline', draft.deadline), { req: true }) +
      '<div class="hint">提交后状态记录为「已决策」，到复查日期前不再反复摇摆。</div>';
    openModal({
      title: '底线决策卡',
      body: body,
      wide: true,
      footer: '<button type="button" class="btn" data-close>取消</button>' +
        '<button type="button" class="btn btn-primary" id="decision-ok">提交决策</button>',
      onMount: function (o) {
        var bodyEl = o.querySelector('.modal-body');
        o.querySelector('[data-close]').addEventListener('click', function () { closeModal(o); });
        o.querySelector('#decision-ok').addEventListener('click', function () {
          readFields(bodyEl, draft);
          if (!draft.choice) { toast('请选择一个方案', 'error'); return; }
          if (!draft.reason || draft.reason.length < 4) { toast('请写清楚理由（至少 4 个字）', 'error'); return; }
          if (!draft.deadline) { toast('请设定截止/复查日期', 'error'); return; }
          rule.decisions = rule.decisions || [];
          rule.decisions.push({
            id: C.uid('dec'), choice: draft.choice, reason: draft.reason,
            deadline: draft.deadline, createdAt: nowISO(), reviewedAt: null
          });
          persist();
          closeModal(o);
          toast('决策已记录。到 ' + C.fmtDate(draft.deadline) + ' 复查。');
          render();
        });
      }
    });
  }

  // ================================================================ 赛道雷达
  function renderRadar(view) {
    var items = state.data.watchItems || [];
    var html = pageHead('赛道雷达', '持续收集信息，等增量出现，而不是硬挤拥挤赛道',
      '<button class="btn btn-primary" data-action="add-radar">新增观察</button>');

    var counts = {
      observing: items.filter(function (w) { return w.status === 'observing'; }).length,
      researching: items.filter(function (w) { return w.status === 'researching'; }).length,
      entered: items.filter(function (w) { return w.status === 'entered'; }).length,
      dropped: items.filter(function (w) { return w.status === 'dropped'; }).length
    };
    html += '<div class="grid grid-4">' +
      '<div class="card"><div class="stat-label">观察中</div><div class="stat-value">' + counts.observing + '</div><div class="stat-sub">待 ≥30 天才能升级</div></div>' +
      '<div class="card"><div class="stat-label">研究中</div><div class="stat-value">' + counts.researching + '</div><div class="stat-sub">正在验证信号</div></div>' +
      '<div class="card"><div class="stat-label">已进入</div><div class="stat-value">' + counts.entered + '</div><div class="stat-sub">已投入资源</div></div>' +
      '<div class="card"><div class="stat-label">已放弃</div><div class="stat-value">' + counts.dropped + '</div><div class="stat-sub">记录放弃原因同样重要</div></div>' +
    '</div>';

    html += '<div class="card section-gap"><div class="card-title"><h2>观察清单</h2>' +
      '<div class="card-actions"><button class="btn btn-sm btn-ghost" data-action="radar-filter" data-id="all">全部 ' + items.length + '</button>' +
      ['observing', 'researching', 'entered', 'dropped'].map(function (s) {
        return '<button class="btn btn-sm ' + (state.radarFilter === s ? 'btn-primary' : 'btn-ghost') + '" data-action="radar-filter" data-id="' + s + '">' +
          C.enumLabel(C.ENUMS.watchStatus, s) + ' ' + counts[s] + '</button>';
      }).join('') + '</div></div>';

    var filtered = state.radarFilter === 'all' ? items : items.filter(function (w) { return w.status === state.radarFilter; });
    filtered.sort(function (a, b) { return (a.status === 'dropped' ? 1 : 0) - (b.status === 'dropped' ? 1 : 0) || (b.updatedAt || '') > (a.updatedAt || '') ? 1 : -1; });
    if (!filtered.length) {
      html += '<div class="empty" style="padding:30px"><div class="empty-title">' + (items.length ? '这个状态下没有条目' : '雷达里还没有东西') + '</div>' +
        '<div class="small">看到感兴趣的方向，先记一条「观察中」，写清你看到的信号。</div>' +
        '<button class="btn btn-primary mt-3" data-action="add-radar">记录第一条观察</button></div>';
    } else {
      filtered.forEach(function (w) { html += radarItemHtml(w); });
    }
    html += '</div>';
    view.innerHTML = html;
  }

  function radarItemHtml(w) {
    var due = w.nextReviewAt && w.nextReviewAt <= C.todayISO();
    var days = C.observationDays(w);
    var canUpgrade = C.canWatchTransition(w, 'researching').ok;
    return '<div class="radar-item">' +
      '<div class="radar-head"><span class="radar-name">' + esc(w.name) + '</span>' +
        enumBadge(C.ENUMS.watchStatus, w.status) +
        '<span class="tiny faint">拥挤度 ' + C.fmtNum(w.crowdedness) + '/5 · 已观察 ' + days + ' 天</span>' +
        '<div class="radar-actions">' +
          '<button class="btn btn-xs" data-action="status-radar" data-id="' + w.id + '">状态流转</button>' +
          '<button class="btn btn-xs btn-ghost" data-action="edit-radar" data-id="' + w.id + '">编辑</button>' +
          '<button class="btn btn-xs btn-ghost" data-action="delete-radar" data-id="' + w.id + '">删除</button>' +
        '</div></div>' +
      '<div class="radar-grid">' +
        '<div><span class="k">信号</span>' + (w.signals && w.signals.length
          ? '<ul class="radar-signals">' + w.signals.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ul>'
          : '<span class="v">—</span>') + '</div>' +
        '<div><span class="k">能力交集</span><span class="v">' + esc(w.skillOverlap || '—') + '</span></div>' +
        '<div><span class="k">研究触发条件</span><span class="v">' + esc(w.researchTrigger || '—') + '</span></div>' +
        (w.sources && w.sources.length ? '<div><span class="k">来源</span><span class="v">' + w.sources.map(function (s) {
          return '<a href="' + esc(s) + '" target="_blank" rel="noopener">' + esc(s.replace(/^https?:\/\//, '').slice(0, 42)) + '</a>';
        }).join('、') + '</span></div>' : '') +
      '</div>' +
      '<div class="radar-meta">' +
        (w.nextReviewAt ? '<span class="' + (due ? 'due' : '') + '">下次回看 ' + esc(C.fmtDate(w.nextReviewAt)) + (due ? '（已到期）' : '') + '</span>' : '') +
        (w.status === 'observing' && !canUpgrade ? '<span>观察满 30 天才能升级（还差 ' + C.canWatchTransition(w, 'researching').daysLeft + ' 天）</span>' : '') +
        (w.notes ? '<span>备注：' + esc(w.notes) + '</span>' : '') +
      '</div>' +
      '</div>';
  }

  function openRadarEditor(existing) {
    var draft = existing ? JSON.parse(JSON.stringify(existing)) : {
      id: C.uid('w'), name: '', sources: [], signals: [], skillOverlap: '',
      crowdedness: 3, status: 'observing', researchTrigger: '',
      observationStartedAt: C.todayISO(), nextReviewAt: C.isoDate(new Date(Date.now() + 30 * 86400000)),
      notes: '', statusHistory: [], createdAt: nowISO(), updatedAt: nowISO()
    };
    var body = '<div class="hidden error-list" id="radar-errors"></div>' +
      fieldWrap('赛道 / 方向名', textControl('name', draft.name, { placeholder: '一句话' }), { req: true }) +
      fieldWrap('看到的信号（每行一条，至少 2 条）', textareaControl('signals_text', (draft.signals || []).join('\n'), { rows: 3, placeholder: '事实，不是感觉' }), { req: true }) +
      fieldWrap('与我能力的交集 / 缺口', textareaControl('skillOverlap', draft.skillOverlap, { rows: 2 })) +
      '<div class="form-grid">' +
      fieldWrap('拥挤度（1–5，越高越挤）', numControl('crowdedness', draft.crowdedness)) +
      fieldWrap('下次回看日期', dateControl('nextReviewAt', draft.nextReviewAt)) +
      '</div>' +
      fieldWrap('进入研究的触发条件', textControl('researchTrigger', draft.researchTrigger, { placeholder: '例如：出现 3 个以上非巨头玩家融资' })) +
      fieldWrap('来源链接（每行一条）', textareaControl('sources_text', (draft.sources || []).join('\n'), { rows: 2 })) +
      fieldWrap('备注', textareaControl('notes', draft.notes, { rows: 2 }));
    openModal({
      title: existing ? '编辑观察条目' : '新增观察条目',
      body: body,
      wide: true,
      footer: '<button type="button" class="btn" data-close>取消</button>' +
        '<button type="button" class="btn btn-primary" id="radar-save">保存</button>',
      onMount: function (o) {
        var bodyEl = o.querySelector('.modal-body');
        o.querySelector('[data-close]').addEventListener('click', function () { closeModal(o); });
        o.querySelector('#radar-save').addEventListener('click', function () {
          readFields(bodyEl, draft);
          draft.signals = String(draft.signals_text || '').split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
          draft.sources = String(draft.sources_text || '').split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
          delete draft.signals_text; delete draft.sources_text;
          var errors = C.validateWatchItem(draft);
          showErrors(o, errors);
          if (errors.length) { toast('观察条目信息不完整', 'error'); return; }
          draft.updatedAt = nowISO();
          if (existing) {
            var idx = state.data.watchItems.findIndex(function (w) { return w.id === existing.id; });
            if (idx >= 0) state.data.watchItems[idx] = draft;
          } else {
            state.data.watchItems.push(draft);
          }
          persist();
          closeModal(o);
          toast(existing ? '观察条目已更新' : '已加入观察清单，30 天后才能升级');
          render();
        });
      }
    });
  }

  function openStatusModal(watchId) {
    var item = state.data.watchItems.filter(function (w) { return w.id === watchId; })[0];
    if (!item) return;
    var options = C.ENUMS.watchStatus.filter(function (s) { return s.value !== item.status; });
    var body = '<div class="small muted mb-3">当前状态：' + esc(C.enumLabel(C.ENUMS.watchStatus, item.status)) +
      ' · 已观察 ' + C.observationDays(item) + ' 天</div>' +
      fieldWrap('变更到', radiosControl('status', '', options), { req: true }) +
      (item.status === 'observing'
        ? '<div class="hint mb-3">规则：观察期内（满 30 天前）不能升级为「研究中 / 已进入」，防止 FOMO 决策；放弃不受限制。</div>'
        : '') +
      fieldWrap('变更理由（可选）', textControl('note', '', { placeholder: '为什么现在改状态' }));
    var draft = { status: '', note: '' };
    openModal({
      title: '状态流转',
      body: body,
      footer: '<button type="button" class="btn" data-close>取消</button>' +
        '<button type="button" class="btn btn-primary" id="status-ok">确认变更</button>',
      onMount: function (o) {
        var bodyEl = o.querySelector('.modal-body');
        o.querySelector('[data-close]').addEventListener('click', function () { closeModal(o); });
        o.querySelector('#status-ok').addEventListener('click', function () {
          readFields(bodyEl, draft);
          if (!draft.status) { toast('请选择目标状态', 'error'); return; }
          var check = C.canWatchTransition(item, draft.status);
          if (!check.ok) {
            toast('观察期未满，还差 ' + check.daysLeft + ' 天才能升级', 'error');
            return;
          }
          item.statusHistory = item.statusHistory || [];
          item.statusHistory.push({ from: item.status, to: draft.status, at: nowISO(), note: draft.note || '' });
          item.status = draft.status;
          item.updatedAt = nowISO();
          if (draft.status === 'researching' || draft.status === 'entered') {
            item.statusSince = C.todayISO();
          }
          persist();
          closeModal(o);
          toast('状态已更新');
          render();
        });
      }
    });
  }

  // ================================================================ 设置
  function renderSettings(view) {
    var data = state.data;
    var backupDays = C.backupDays(data);
    var html = pageHead('设置与备份', '数据只保存在这台电脑的浏览器里，请定期导出备份');

    html += '<div class="card"><div class="card-title"><h2>基础设置</h2></div>' +
      '<div class="form-grid">' +
      fieldWrap('市场同岗位月薪中位数', numControl('settings.marketMedianSalary', data.settings.marketMedianSalary), { hint: '新建复盘时会自动带出' }) +
      fieldWrap('每周信息定投目标（分钟）', numControl('settings.weeklyInputGoalMinutes', data.settings.weeklyInputGoalMinutes)) +
      '</div>' +
      '<button class="btn btn-primary" data-action="save-settings">保存设置</button></div>';

    html += '<div class="card section-gap"><div class="card-title"><h2>数据与备份</h2></div>' +
      '<div class="small muted mb-3">上次导出：' + (data.lastExportAt ? esc(C.fmtDate(data.lastExportAt)) + '（' + backupDays + ' 天前）' : '从未导出') +
      ' · 建议每季度复盘完成后导出一次。</div>' +
      '<div class="flex-gap">' +
        '<button class="btn btn-primary" data-action="export-data">导出 JSON 备份</button>' +
        '<button class="btn" data-action="import-data">导入备份</button>' +
        '<input type="file" id="import-file" accept="application/json,.json" class="hidden">' +
      '</div>' +
      '<div class="hint mt-3">导入会覆盖当前全部数据，操作前建议先导出一次。</div></div>';

    html += '<div class="card section-gap"><div class="card-title"><h2>危险操作</h2></div>' +
      '<div class="small muted mb-3">重置会清空全部复盘、目标、底线决策和观察记录，且无法撤销。</div>' +
      '<button class="btn btn-danger" data-action="reset-data">清空所有数据</button></div>';

    html += '<div class="card section-gap"><div class="card-title"><h2>关于</h2></div>' +
      '<div class="small muted" style="line-height:1.9">' +
      '前途 v1.0 MVP · 数据格式 v' + C.SCHEMA_VERSION + '<br>' +
      '存储位置：本机浏览器 localStorage（键名 <span class="kbd">' + esc(C.STORE_KEY) + '</span>）<br>' +
      '无账号、无联网、无云端。换电脑或换浏览器请用 JSON 备份迁移。<br>' +
      '设计原则：结论先行 · 数字优先 · 少而硬 · 可回溯。</div></div>';

    view.innerHTML = html;

    var fileInput = $('#import-file');
    fileInput.addEventListener('change', function () {
      var file = fileInput.files && fileInput.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var imported = C.importJSON(String(reader.result));
          confirmAction({
            title: '确认导入',
            message: '导入后当前数据会被覆盖：' + imported.reviews.length + ' 份复盘、' + imported.goals.length + ' 个目标、' + imported.watchItems.length + ' 条观察。',
            okLabel: '覆盖导入',
            danger: true,
            onOk: function () {
              state.data = imported;
              persist();
              toast('备份已导入');
              render();
            }
          });
        } catch (e) {
          toast('导入失败：' + e.message, 'error');
        }
      };
      reader.readAsText(file);
      fileInput.value = '';
    });
  }

  // ================================================================ 全局动作分发
  var ACTIONS = {
    'new-review': function () { openQuarterPicker(); },
    'back-reviews': function () { goto('#/reviews'); },
    'delete-review': function (el) {
      var review = getReview(el.dataset.id);
      if (!review) return;
      confirmAction({
        title: '删除复盘', message: '确定删除 ' + review.quarter + ' 的复盘吗？底线状态会重新计算。',
        okLabel: '删除', danger: true,
        onOk: function () {
          state.data.reviews = state.data.reviews.filter(function (r) { return r.id !== review.id; });
          persist();
          toast('复盘已删除');
          goto('#/reviews');
        }
      });
    },
    'toggle-compare': function () { state.showCompare = !state.showCompare; render(); },
    'add-goal': function () {
      if (C.activeGoals(state.data.goals, currentFy()).length >= 2) openGoalLimitModal();
      else openGoalEditor(null);
    },
    'edit-goal': function (el) { openGoalEditor(findGoal(el.dataset.id)); },
    'update-kr': function (el) { var g = findGoal(el.dataset.id); if (g) openUpdateKrModal(g); },
    'goal-achieved': function (el) {
      var g = findGoal(el.dataset.id); if (!g) return;
      confirmAction({
        title: '标记达成', message: '「' + g.title + '」标记为已达成？', okLabel: '确认达成',
        onOk: function () { g.status = 'achieved'; g.achievedAt = C.todayISO(); g.updatedAt = nowISO(); persist(); toast('已标记达成'); render(); }
      });
    },
    'goal-drop': function (el) {
      var g = findGoal(el.dataset.id); if (!g) return;
      confirmAction({
        title: '放弃目标', message: '放弃「' + g.title + '」会写入放弃清单，需要记录原因。',
        inputLabel: '放弃原因', inputPlaceholder: '例如：与核心目标冲突，主动收缩', okLabel: '确认放弃', danger: true,
        onOk: function (reason) {
          g.status = 'dropped'; g.dropReason = reason; g.droppedAt = C.todayISO(); g.updatedAt = nowISO();
          persist(); toast('已加入放弃清单'); render();
        }
      });
    },
    'restore-goal': function (el) {
      var g = findGoal(el.dataset.id); if (!g) return;
      if (C.activeGoals(state.data.goals, currentFy()).length >= 2) { toast('最多只能有 2 个进行中目标，请先归档其他目标', 'error'); return; }
      g.status = 'active'; g.dropReason = ''; g.updatedAt = nowISO(); persist(); toast('目标已恢复'); render();
    },
    'delete-goal': function (el) {
      var g = findGoal(el.dataset.id); if (!g) return;
      confirmAction({
        title: '删除目标', message: '删除后无法恢复，确定吗？', okLabel: '删除', danger: true,
        onOk: function () {
          state.data.goals = state.data.goals.filter(function (x) { return x.id !== g.id; });
          persist(); toast('已删除'); render();
        }
      });
    },
    'midyear': function () { openMidYearModal(); },
    'yearend': function () { openYearEndModal(); },
    'yearend-year': function (el) { openYearEndModal(parseInt(el.dataset.id, 10)); },
    'open-decision': function (el) { openDecisionCard(el.dataset.id); },
    'review-decision': function (el) {
      var rule = getRawRule(el.dataset.id); if (!rule) return;
      var d = C.currentDecision(rule);
      if (!d) return;
      confirmAction({
        title: '标记已复查', message: '确认已按决策执行并复查？此操作会归档当前决策；若规则仍为红色，需要重新填写决策卡。',
        okLabel: '确认复查',
        onOk: function () { d.reviewedAt = nowISO(); persist(); toast('决策已归档'); render(); }
      });
    },
    'add-radar': function () { openRadarEditor(null); },
    'edit-radar': function (el) { var w = findWatch(el.dataset.id); if (w) openRadarEditor(w); },
    'status-radar': function (el) { openStatusModal(el.dataset.id); },
    'delete-radar': function (el) {
      var w = findWatch(el.dataset.id); if (!w) return;
      confirmAction({
        title: '删除观察条目', message: '确定删除「' + w.name + '」吗？', okLabel: '删除', danger: true,
        onOk: function () {
          state.data.watchItems = state.data.watchItems.filter(function (x) { return x.id !== w.id; });
          persist(); toast('已删除'); render();
        }
      });
    },
    'radar-filter': function (el) { state.radarFilter = el.dataset.id; render(); },
    'save-settings': function () {
      var view = $('#view');
      var data = state.data;
      var market = view.querySelector('[data-path="settings.marketMedianSalary"]');
      var week = view.querySelector('[data-path="settings.weeklyInputGoalMinutes"]');
      data.settings.marketMedianSalary = C.nullableNum(market.value);
      data.settings.weeklyInputGoalMinutes = C.nullableNum(week.value);
      persist(); toast('设置已保存'); render();
    },
    'export-data': function () { exportData(); },
    'import-data': function () { var f = $('#import-file'); if (f) f.click(); },
    'reset-data': function () {
      confirmAction({
        title: '清空所有数据', message: '这会删除全部内容且无法恢复。建议先导出备份。', okLabel: '确认清空', danger: true,
        inputLabel: '输入「重置」以确认', inputPlaceholder: '重置', inputRequired: '请按要求输入「重置」',
        onOk: function (val) {
          if (val !== '重置') { toast('输入不正确，未执行', 'error'); return; }
          state.data = C.defaultData(new Date());
          persist(); toast('数据已清空'); goto('#/home');
        }
      });
    },
    'log-input': function () {
      state.data.inputLog = state.data.inputLog || [];
      state.data.inputLog.push({ date: C.todayISO(), minutes: 30 });
      persist(); toast('已记录 30 分钟信息输入'); render();
    },
    'btn': function (el) { if (el.dataset.href) goto(el.dataset.href); }
  };

  function findGoal(id) { return state.data.goals.filter(function (g) { return g.id === id; })[0] || null; }
  function findWatch(id) { return state.data.watchItems.filter(function (w) { return w.id === id; })[0] || null; }

  function exportData() {
    var text = C.exportJSON(state.data);
    var blob = new Blob([text], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = '前途备份-' + C.todayISO() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    state.data.lastExportAt = C.todayISO();
    persist();
    toast('备份已导出');
    if (state.route === 'settings') render();
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var fn = ACTIONS[el.dataset.action];
    if (!fn) return;
    e.preventDefault();
    try { fn(el, e); } catch (err) { console.error(err); toast('操作失败：' + err.message, 'error'); }
  });

  // ================================================================ 启动
  function init() {
    state.demo = /(\?|&)demo=1/.test(location.search);
    var stored = state.demo ? null : C.loadData();
    if (stored) {
      state.data = stored;
    } else if (state.demo) {
      state.data = C.buildDemoData(new Date());
      var tag = $('#demo-tag');
      if (tag) tag.classList.remove('hidden');
    } else {
      state.data = C.defaultData(new Date());
      C.saveData(state.data);
    }

    // 事件委托只绑定一次（#view 元素本身不会被替换）
    var viewEl = $('#view');
    viewEl.addEventListener('input', function (e) {
      if (state.route === 'review') onReviewInput(e);
    });
    viewEl.addEventListener('change', function (e) {
      if (state.route === 'review') onReviewInput(e);
      else if (state.route === 'bottom') handleRuleThresholdChange(e);
    });
    viewEl.addEventListener('click', function (e) {
      if (state.route === 'review') onReviewClick(e);
    });

    if (!location.hash) {
      location.hash = '#/home';
    } else {
      render();
    }
    window.__qiantuBooted = true;
    window.addEventListener('beforeunload', function () {
      if (!state.demo && state.saveTimer) C.saveData(state.data);
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>
</body>
</html>
